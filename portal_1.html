<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIS GIM - Advanced Spatial Suite</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Draw Plugin -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <!-- Turf.js for Topology & Mensuration -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <!-- Auth Guard - redirects to login if not logged in -->
  <script src="auth-guard.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background-color: #1a1a24; color: #ffffff; }

    header {
      background: #0b0e15;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2a2c3d;
    }
    header h1 { font-size: 20px; color: #00d2ff; letter-spacing: 1px; }
    .status-badge {
      background: #0d2a1a;
      color: #2ecc8f;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      border: 1px solid #2ecc8f44;
    }

    .container { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 320px;
      background: #14151e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-right: 1px solid #2a2c3d;
      overflow-y: auto;
    }

    .tool-group {
      background: #1e202d;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a2c3d;
    }

    .tool-group h3 { font-size: 13px; text-transform: uppercase; color: #8892b0; margin-bottom: 10px; }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #2a2042;
      color: #fff;
      border: 1px solid #3d4155;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    button:hover { background: #00d2ff; color: #000; border-color: #00d2ff; }

    .output-card {
      background: #0d0e15;
      padding: 10px;
      border-radius: 5px;
      color: #a0b2d3;
      font-size: 13px;
      min-height: 80px;
      line-height: 1.5;
    }

    #map { flex: 1; height: 100%; background: #0a0b10; }
  </style>
</head>
<body>

  <header>
    <h1>🗺 Waqar GIS Portal</h1>
    <span class="status-badge">● Active Engine</span>
  </header>

  <div class="container">
    <div class="sidebar">

      <!-- Basemap -->
      <div class="tool-group">
        <h3>1. Basemap Layer</h3>
        <button onclick="setBasemap('osm')">Street Map (OSM)</button>
        <button onclick="setBasemap('sat')">Satellite Imagery</button>
      </div>

      <!-- Topology -->
      <div class="tool-group">
        <h3>2. Topology Check</h3>
        <button onclick="checkTopology()">Validate Topology</button>
      </div>

      <!-- Mensuration -->
      <div class="tool-group">
        <h3>3. Mensuration Panel</h3>
        <div class="output-card" id="results">
          <em>Draw any Point, Line, or Polygon using the toolbar on the map to calculate measurements.</em>
        </div>
      </div>

      <!-- Export -->
      <div class="tool-group">
        <h3>4. Export Data</h3>
        <button onclick="exportGeoJSON()" style="background:#1d4a2b; border-color:#2a7343;">Download GeoJSON</button>
      </div>

    </div>

    <div id="map"></div>
  </div>

  <script>
    // Map init
    const map = L.map('map').setView([34.0151, 71.5249], 13);

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

    osmLayer.addTo(map);

    function setBasemap(type) {
      if (type === 'sat') { map.removeLayer(osmLayer); satLayer.addTo(map); }
      else { map.removeLayer(satLayer); osmLayer.addTo(map); }
    }

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      edit: { featureGroup: drawnItems },
      draw: { polygon: true, polyline: true, circle: false, rectangle: true, marker: true, circlemarker: false }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, function (e) {
      drawnItems.addLayer(e.layer);
      calculateLayerMensuration(e.layer);
    });

    function calculateLayerMensuration(layer) {
      const geojson = layer.toGeoJSON();
      const type = geojson.geometry.type;
      let html = '';

      if (type === 'Polygon') {
        const areaM2 = turf.area(geojson);
        const areaHa = (areaM2 / 10000).toFixed(2);
        const areaMarla = (areaM2 / 25.2929).toFixed(2);
        const perimeterM = turf.length(geojson, { units: 'kilometers' }) * 1000;
        html = `<strong>Type:</strong> Polygon<br>
                <strong>Area:</strong> ${areaM2.toFixed(2)} m² (${areaHa} ha / ${areaMarla} Marla)<br>
                <strong>Perimeter:</strong> ${perimeterM.toFixed(2)} meters`;
      } else if (type === 'LineString') {
        const lengthM = turf.length(geojson, { units: 'kilometers' }) * 1000;
        html = `<strong>Type:</strong> Line<br>
                <strong>Length:</strong> ${lengthM.toFixed(2)} m (${(lengthM/1000).toFixed(2)} km)`;
      } else if (type === 'Point') {
        const c = geojson.geometry.coordinates;
        html = `<strong>Type:</strong> Point<br>
                <strong>Lat:</strong> ${c[1].toFixed(5)}<br>
                <strong>Lng:</strong> ${c[0].toFixed(5)}`;
      }
      document.getElementById('results').innerHTML = html;
    }

    function checkTopology() {
      const data = drawnItems.toGeoJSON();
      if (data.features.length === 0) { alert('Pehle map par koi shape draw karein!'); return; }
      let errors = 0;
      data.features.forEach(f => {
        if (f.geometry.type === 'Polygon') {
          const kinks = turf.kinks(f);
          errors += kinks.features.length;
        }
      });
      alert(errors > 0 ? `Topology Error! ${errors} self-intersection(s) mili hain.` : 'Topology Valid! Sab features sahi hain.');
    }

    function exportGeoJSON() {
      const data = drawnItems.toGeoJSON();
      if (data.features.length === 0) { alert('Pehle kuch digitize karein!'); return; }
      const a = document.createElement('a');
      a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(data));
      a.download = 'waqar_gis_layer.geojson';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  </script>
</body>
</html>
