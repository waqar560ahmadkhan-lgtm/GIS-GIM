<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Waqar GIS Portal – Login</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

/* =========================================================
   RESET
========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {

    --gold: #c9a24a;
    --gold-soft: #f0d27a;
    --gold-light: #f6df9b;
    --gold-deep: #8b6825;

    --silver: #d7d9d8;
    --silver-dark: #777b7d;

    --taupe: #9a8970;
    --taupe-light: #b9a991;

    --brown: #5c4c39;

    --charcoal: #121212;
    --charcoal-2: #181715;
    --charcoal-3: #211f1a;

    --error: #e08a80;
}


/* =========================================================
   HTML / BODY
========================================================= */

html,
body {

    width: 100%;
    height: 100%;
    min-height: 100%;

}

body {

    font-family: 'Inter', sans-serif;

    color: #ece7dc;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    overflow: hidden;

    /*
    ========================================================
    IMPORTANT:
    WORLD MAP IMAGE MUST BE:
    
    index.html
    map-bg.jpg

    Same folder.
    ========================================================
    */

    background-image: url("./map-bg.jpg");

    background-position: center center;

    background-size: cover;

    background-repeat: no-repeat;

    background-attachment: fixed;

    background-color: #101010;

}


/* =========================================================
   MAP DARK OVERLAY
   ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background:

        linear-gradient(
            rgba(5,5,5,0.48),
            rgba(5,5,5,0.48)
        );

}


/* =========================================================
   CINEMATIC GOLD ATMOSPHERE
========================================================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    z-index: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(201,162,74,0.06) 0%,
            rgba(0,0,0,0.10) 40%,
            rgba(0,0,0,0.35) 100%
        );

}


/* =========================================================
   MAIN FRAME
========================================================= */

.outer-frame {

    position: relative;

    z-index: 5;

    width: 100%;

    max-width: 430px;

    margin: 24px;

    padding: 5px;

    background:

        linear-gradient(
            145deg,

            #f1e3bd 0%,

            #d8d9d7 10%,

            #9c9d9d 27%,

            #e7d7aa 43%,

            #a9aaab 58%,

            #676a6b 76%,

            #d2c28e 90%,

            #f0dfae 100%
        );

    border-radius: 6px;

    box-shadow:

        0 35px 90px rgba(0,0,0,0.85),

        0 12px 30px rgba(0,0,0,0.65),

        0 0 0 1px rgba(255,255,255,0.40) inset,

        0 0 30px rgba(201,162,74,0.25);

}


/* =========================================================
   INNER GOLD FRAME
========================================================= */

.inner-frame {

    padding: 3px;

    border-radius: 4px;

    background:

        linear-gradient(
            135deg,

            #f5df9f 0%,

            #d3ae55 18%,

            #8d6c2b 38%,

            #c49b42 55%,

            #765a25 76%,

            #e5c873 100%
        );

    box-shadow:

        0 0 0 1px
        rgba(255,239,180,0.45) inset,

        0 0 14px
        rgba(201,162,74,0.22);

}


/* =========================================================
   DARK INTERIOR
========================================================= */

.container {

    position: relative;

    padding: 34px 32px 30px;

    border-radius: 3px;

    background:

        linear-gradient(
            180deg,

            rgba(31,29,24,0.985) 0%,

            rgba(17,17,16,0.99) 55%,

            rgba(12,12,11,0.995) 100%
        );

    box-shadow:

        0 0 0 1px
        rgba(255,255,255,0.04) inset,

        0 0 35px
        rgba(0,0,0,0.40);

}


/* =========================================================
   INNER BORDER
========================================================= */

.container::before {

    content: "";

    position: absolute;

    inset: 8px;

    border:

        1px solid
        rgba(201,162,74,0.30);

    border-radius: 2px;

    pointer-events: none;

}


.container::after {

    content: "";

    position: absolute;

    inset: 12px;

    border:

        1px solid
        rgba(154,137,112,0.08);

    border-radius: 1px;

    pointer-events: none;

}


/* =========================================================
   HEADER
========================================================= */

.crest {

    position: relative;

    z-index: 2;

    text-align: center;

    margin-bottom: 28px;

}


.crest-mark {

    width: 48px;

    height: 48px;

    margin: 0 auto 14px;

    border:

        1.5px solid
        var(--gold);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    background:

        radial-gradient(
            circle,
            rgba(201,162,74,0.15),
            rgba(201,162,74,0.025)
        );

    box-shadow:

        0 0 15px
        rgba(201,162,74,0.12),

        0 0 0 1px
        rgba(255,255,255,0.04) inset;

}


.crest-mark::before {

    content: "";

    position: absolute;

    inset: 5px;

    border:

        1px solid
        rgba(240,210,122,0.40);

    border-radius: 50%;

}


.crest-mark::after {

    content: "";

    position: absolute;

    inset: -4px;

    border:

        1px solid
        rgba(215,217,216,0.12);

    border-radius: 50%;

}


.crest-mark svg {

    width: 19px;

    height: 19px;

    fill: var(--gold-light);

    position: relative;

    z-index: 2;

    filter:

        drop-shadow(
            0 0 4px
            rgba(240,210,122,0.35)
        );

}


.crest h1 {

    font-family:
        'Cormorant Garamond',
        serif;

    font-weight: 700;

    font-size: 1.7rem;

    letter-spacing: 2px;

    color: var(--gold-light);

    text-transform: uppercase;

    text-shadow:

        0 1px 10px
        rgba(201,162,74,0.18);

}


.crest .hair {

    width: 34px;

    height: 1px;

    margin: 12px auto;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );

}


.crest p {

    font-size: 0.64rem;

    color: var(--taupe-light);

    letter-spacing: 2px;

    text-transform: uppercase;

}


/* =========================================================
   STATUS DOT
========================================================= */

.status-dot {

    display: inline-block;

    width: 5px;

    height: 5px;

    margin-right: 7px;

    border-radius: 50%;

    background: var(--gold);

    box-shadow:

        0 0 6px
        rgba(201,162,74,0.75);

    animation: pulse 2s infinite;

}


@keyframes pulse {

    0%,
    100% {
        opacity: 1;
    }

    50% {
        opacity: 0.4;
    }

}


/* =========================================================
   CARD
========================================================= */

.card {

    position: relative;

    z-index: 2;

}


/* =========================================================
   TABS
========================================================= */

.tabs {

    display: flex;

    gap: 24px;

    margin-bottom: 26px;

    border-bottom:

        1px solid
        rgba(154,137,112,0.28);

}


.tab-btn {

    padding: 0 0 11px;

    border: none;

    background: transparent;

    color: #8e8573;

    font-family: 'Inter', sans-serif;

    font-size: 0.68rem;

    font-weight: 700;

    letter-spacing: 2px;

    text-transform: uppercase;

    cursor: pointer;

    position: relative;

    transition:

        color 0.2s ease;

}


.tab-btn:hover {

    color: #cbb98f;

}


.tab-btn.active {

    color: var(--gold-light);

}


.tab-btn.active::after {

    content: "";

    position: absolute;

    left: 0;

    right: 0;

    bottom: -1px;

    height: 2px;

    background:

        linear-gradient(
            90deg,
            var(--gold-deep),
            var(--gold-soft),
            var(--gold-deep)
        );

    box-shadow:

        0 0 7px
        rgba(201,162,74,0.35);

}


/* =========================================================
   FORM
========================================================= */

.form-group {

    margin-bottom: 18px;

}


label {

    display: block;

    font-size: 0.6rem;

    font-weight: 600;

    color: var(--taupe-light);

    margin-bottom: 8px;

    text-transform: uppercase;

    letter-spacing: 1.5px;

}


input {

    width: 100%;

    padding: 11px 12px;

    background:

        linear-gradient(
            180deg,
            rgba(36,34,29,0.96),
            rgba(18,18,17,0.99)
        );

    border:

        1px solid
        rgba(154,137,112,0.32);

    border-radius: 4px;

    color: #f0e8d4;

    font-family: 'Inter', sans-serif;

    font-size: 0.86rem;

    outline: none;

    transition:

        border-color 0.25s,

        box-shadow 0.25s,

        background 0.25s;

}


input:hover {

    border-color:

        rgba(201,162,74,0.48);

}


input:focus {

    border-color:

        var(--gold);

    background:

        linear-gradient(
            180deg,
            rgba(43,39,31,0.98),
            rgba(20,19,17,0.99)
        );

    box-shadow:

        0 0 0 2px
        rgba(201,162,74,0.08),

        0 0 14px
        rgba(201,162,74,0.07);

}


input::placeholder {

    color: #706754;

}


/* =========================================================
   BUTTON
========================================================= */

.btn {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border: none;

    border-radius: 4px;

    background:

        linear-gradient(
            135deg,

            #f0d27a 0%,

            #d5b35b 25%,

            #b38b35 55%,

            #d0aa4f 78%,

            #8d6c2b 100%
        );

    color: #1b160b;

    font-family: 'Inter', sans-serif;

    font-size: 0.7rem;

    font-weight: 800;

    letter-spacing: 2.2px;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:

        0 8px 20px
        rgba(201,162,74,0.28),

        0 1px 0
        rgba(255,244,199,0.55) inset,

        0 -1px 0
        rgba(94,69,22,0.35) inset;

    transition:

        opacity 0.2s,

        transform 0.15s,

        box-shadow 0.2s;

}


.btn:hover {

    opacity: 0.94;

    transform: translateY(-1px);

    box-shadow:

        0 11px 25px
        rgba(201,162,74,0.34),

        0 1px 0
        rgba(255,244,199,0.6) inset;

}


.btn:active {

    transform: translateY(0);

}


/* =========================================================
   MESSAGES
========================================================= */

.msg {

    font-size: 0.74rem;

    padding: 9px 12px;

    border-radius: 4px;

    margin-bottom: 14px;

    display: none;

    letter-spacing: 0.3px;

}


.msg.error {

    background:

        rgba(224,138,128,0.12);

    color: var(--error);

    border:

        1px solid
        rgba(224,138,128,0.30);

    display: block;

}


.msg.success {

    background:

        rgba(201,162,74,0.12);

    color: var(--gold-soft);

    border:

        1px solid
        rgba(201,162,74,0.35);

    display: block;

}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

    text-align: center;

    color: #8f846e;

    font-size: 0.6rem;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin: 22px 0 4px;

    position: relative;

}


.divider::before,
.divider::after {

    content: "";

    position: absolute;

    top: 50%;

    width: 26%;

    height: 1px;

}


.divider::before {

    left: 0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(154,137,112,0.32)
        );

}


.divider::after {

    right: 0;

    background:

        linear-gradient(
            90deg,
            rgba(154,137,112,0.32),
            transparent
        );

}


/* =========================================================
   COORDINATES
========================================================= */

.coords {

    position: fixed;

    bottom: 16px;

    right: 20px;

    z-index: 6;

    font-size: 0.62rem;

    color:

        rgba(255,255,255,0.65);

    font-family: 'Inter', sans-serif;

    letter-spacing: 1px;

    text-shadow:

        0 1px 5px
        rgba(0,0,0,0.9);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:600px) {

    body {

        padding: 16px;

        background-position:
            center center;

    }

    .outer-frame {

        max-width: 430px;

        margin: 12px auto;

        padding: 4px;

    }

    .container {

        padding:
            30px 24px 26px;

    }

    .crest {

        margin-bottom: 24px;

    }

    .crest h1 {

        font-size: 1.55rem;

    }

    .coords {

        bottom: 8px;

        right: 10px;

        font-size: 0.52rem;

    }

}


@media (max-width:380px) {

    body {

        padding: 10px;

    }

    .outer-frame {

        margin: 6px auto;

    }

    .container {

        padding:
            26px 19px 23px;

    }

    .crest-mark {

        width: 44px;

        height: 44px;

    }

    .crest h1 {

        font-size: 1.4rem;

        letter-spacing: 1.6px;

    }

    .tabs {

        gap: 18px;

    }

}


@media (max-height:700px) {

    .outer-frame {

        transform: scale(0.92);

    }

}


@media (max-height:600px) {

    .outer-frame {

        transform: scale(0.82);

    }

}

</style>
</head>


<body>


<!-- =========================================================
     LOGIN FRAME
========================================================= -->

<div class="outer-frame">

    <div class="inner-frame">

        <div class="container">


            <!-- =================================================
                 HEADER
            ================================================= -->

            <div class="crest">

                <div class="crest-mark">

                    <svg
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                        />

                    </svg>

                </div>


                <h1>
                    Waqar GIS
                </h1>


                <div class="hair"></div>


                <p>

                    <span class="status-dot"></span>

                    Spatial Intelligence · Peshawar

                </p>

            </div>


            <!-- =================================================
                 CARD
            ================================================= -->

            <div class="card">


                <!-- TABS -->

                <div class="tabs">

                    <button
                        class="tab-btn active"
                        onclick="switchTab('login')"
                    >

                        Login

                    </button>


                    <button
                        class="tab-btn"
                        onclick="switchTab('register')"
                    >

                        Register

                    </button>

                </div>


                <!-- =================================================
                     LOGIN
                ================================================= -->

                <div id="loginForm">

                    <div
                        id="loginMsg"
                        class="msg"
                    ></div>


                    <div class="form-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPass"
                            placeholder="••••••••"
                        >

                    </div>


                    <button
                        class="btn"
                        onclick="doLogin()"
                    >

                        Enter Portal →

                    </button>

                </div>


                <!-- =================================================
                     REGISTER
                ================================================= -->

                <div
                    id="registerForm"
                    style="display:none;"
                >

                    <div
                        id="regMsg"
                        class="msg"
                    ></div>


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="regName"
                            placeholder="Your name"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="regEmail"
                            placeholder="you@example.com"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="regPass"
                            placeholder="Min 6 characters"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="regPass2"
                            placeholder="Repeat password"
                        >

                    </div>


                    <button
                        class="btn"
                        onclick="doRegister()"
                    >

                        Create Account

                    </button>

                </div>


                <div class="divider">

                    Secured Access

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     COORDINATES
========================================================= -->

<div class="coords">

    34.0151° N, 71.5249° E · KP, Pakistan

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   USERS
========================================================= */

function getUsers() {

    return JSON.parse(
        localStorage.getItem('waqar_gis_users') || '[]'
    );

}


function saveUsers(users) {

    localStorage.setItem(
        'waqar_gis_users',
        JSON.stringify(users)
    );

}


/* =========================================================
   ADMIN
========================================================= */

(function initAdmin() {

    const users = getUsers();

    if (
        !users.find(
            u =>
                u.email ===
                'admin@waqargis.com'
        )
    ) {

        users.push({

            name: 'Waqar (Admin)',

            email: 'admin@waqargis.com',

            password:
                'waqar!!admin125714TaKhT@BhAi',

            role: 'admin'

        });

        saveUsers(users);

    }

})();


/* =========================================================
   SWITCH LOGIN / REGISTER
========================================================= */

function switchTab(tab) {

    document.getElementById('loginForm').style.display =
        tab === 'login'
            ? 'block'
            : 'none';


    document.getElementById('registerForm').style.display =
        tab === 'register'
            ? 'block'
            : 'none';


    document
        .querySelectorAll('.tab-btn')
        .forEach((button, index) => {

            button.classList.toggle(

                'active',

                (index === 0 &&
                    tab === 'login')

                ||

                (index === 1 &&
                    tab === 'register')

            );

        });

}


/* =========================================================
   MESSAGE
========================================================= */

function showMsg(id, text, type) {

    const element =
        document.getElementById(id);

    element.textContent = text;

    element.className =
        'msg ' + type;

}


/* =========================================================
   LOGIN
========================================================= */

function doLogin() {

    const email =
        document
            .getElementById('loginEmail')
            .value
            .trim();


    const password =
        document
            .getElementById('loginPass')
            .value;


    if (!email || !password) {

        showMsg(

            'loginMsg',

            'Please fill all fields.',

            'error'

        );

        return;

    }


    const user =
        getUsers().find(

            u =>

                u.email === email &&

                u.password === password

        );


    if (!user) {

        showMsg(

            'loginMsg',

            'Invalid email or password.',

            'error'

        );

        return;

    }


    showMsg(

        'loginMsg',

        '✓ Login successful! Opening portal...',

        'success'

    );


    sessionStorage.setItem(

        'waqar_gis_session',

        JSON.stringify({

            name: user.name,

            email: user.email,

            role: user.role || 'user'

        })

    );


    setTimeout(() => {

        window.location.href =
            'portal.html';

    }, 900);

}


/* =========================================================
   REGISTER
========================================================= */

function doRegister() {

    const name =
        document
            .getElementById('regName')
            .value
            .trim();


    const email =
        document
            .getElementById('regEmail')
            .value
            .trim();


    const password =
        document
            .getElementById('regPass')
            .value;


    const password2 =
        document
            .getElementById('regPass2')
            .value;


    if (
        !name ||
        !email ||
        !password ||
        !password2
    ) {

        showMsg(

            'regMsg',

            'Please fill all fields.',

            'error'

        );

        return;

    }


    if (password.length < 6) {

        showMsg(

            'regMsg',

            'Password must be at least 6 characters.',

            'error'

        );

        return;

    }


    if (password !== password2) {

        showMsg(

            'regMsg',

            'Passwords do not match.',

            'error'

        );

        return;

    }


    const users = getUsers();


    if (
        users.find(
            u =>
                u.email === email
        )
    ) {

        showMsg(

            'regMsg',

            'This email is already registered.',

            'error'

        );

        return;

    }


    users.push({

        name: name,

        email: email,

        password: password,

        role: 'user'

    });


    saveUsers(users);


    showMsg(

        'regMsg',

        '✓ Account created! You can now login.',

        'success'

    );


    setTimeout(

        () => switchTab('login'),

        1200

    );

}


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(

    'keydown',

    function(event) {

        if (event.key === 'Enter') {

            const loginVisible =

                document
                    .getElementById('loginForm')
                    .style
                    .display !== 'none';


            if (loginVisible) {

                doLogin();

            } else {

                doRegister();

            }

        }

    }

);

</script>

</body>
</html>
