<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Waqar GIS Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f0e0c;
            --panel: #16140f;
            --panel-border: #2a251c;
            --gold: #d4af37;
            --gold-soft: #f3e5ab;
            --sand: #e6e2dd;
            --taupe: #9e9689;
            --error: #e74c3c;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--sand);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #1f1b13 0%, #0f0e0c 100%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .portal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .portal-header .logo-icon {
            font-size: 36px;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .portal-header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            color: var(--gold-soft);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .portal-header p {
            font-size: 13px;
            color: var(--taupe);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--taupe);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            color: var(--taupe);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            color: var(--sand);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
            background-color: rgba(212, 175, 55, 0.02);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%);
            border: none;
            border-radius: 6px;
            color: #0f0e0c;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .alert-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .alert-message.error {
            background-color: rgba(231, 76, 60, 0.1);
            border: 1px solid var(--error);
            color: #ec7063;
            display: block;
        }

        .alert-message.success {
            background-color: rgba(46, 204, 113, 0.1);
            border: 1px solid var(--success);
            color: #2ecc71;
            display: block;
        }

        .portal-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: var(--taupe);
            border-top: 1px solid var(--panel-border);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="portal-header">
            <div class="logo-icon">
                <i class="fa-solid fa-earth-asia"></i>
            </div>
            <h1>Waqar GIS Portal</h1>
            <p>Secure Spatial Workspace</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username / Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Access Portal
            </button>

            <div id="alertBox" class="alert-message"></div>
        </form>

        <div class="portal-footer">
            &copy; 2026 Waqar Ahmad Khan &bull; Independent GIS Professional
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const alertBox = document.getElementById('alertBox');

            // Simple client-side demo validation (Replace with your secure backend check or GitHub Pages token logic)
            // Default credential hint: admin / waqar_gis
            if (user === "admin" && pass === "waqar_gis") {
                alertBox.className = "alert-message success";
                alertBox.innerHTML = "<i class='fa-solid fa-circle-check'></i> Authentication successful! Redirecting...";
                
                setTimeout(() => {
                    // Redirect to your main map dashboard file (e.g., index.html or map.html)
                    window.location.href = "index.html"; 
                }, 1000);
            } else {
                alertBox.className = "alert-message error";
                alertBox.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Invalid username or password.";
            }
        }
    </script>
</body>
</html>
