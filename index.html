<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waqar GIS Portal – Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sand:#d8c9a8;
      --taupe:#8f8474;
      --ink:#2a241c;
      --ink-soft:#c9bfa8;
      --gold:#c9a24a;
      --gold-soft:#e6c877;
      --gold-deep:#8a6d2d;
      --silver:#9aa0a6;
      --silver-dark:#4b4f54;
      --panel:#16140f;
      --panel2:#1d1a13;
      --field-line:#3a3527;
      --error:#e08a80;
    }
    body {
      font-family: 'Inter', sans-serif; color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
      background: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=') center/cover no-repeat, #111;
    }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none;
      background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 75%);
    }

    /* ===== Outer metallic silver frame ===== */
    .outer-frame {
      position: relative; z-index: 1; width: 100%; max-width: 430px; margin: 24px;
      padding: 5px;
      background: linear-gradient(155deg, #c7cbce 0%, #6b6f73 35%, #8f949a 60%, #3f4245 100%);
      border-radius: 6px;
      box-shadow: 0 35px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    /* ===== Champagne gold inner border ===== */
    .inner-frame {
      background: linear-gradient(155deg, #f0d999 0%, #c9a24a 30%, #8a6d2d 70%, #e6c877 100%);
      padding: 3px;
      border-radius: 4px;
    }

    /* ===== Dark charcoal interior ===== */
    .container {
      background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
      border-radius: 3px;
      padding: 34px 32px 30px;
      position: relative;
    }
    .container::before {
      content:''; position:absolute; inset:8px; border:1px solid rgba(201,162,74,0.25); border-radius:2px; pointer-events:none;
    }

    .crest { text-align: center; margin-bottom: 28px; position: relative; z-index: 1; }
    .crest-mark { width: 48px; height: 48px; margin: 0 auto 14px; border: 1.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(201,162,74,0.06); }
    .crest-mark::before { content:''; position:absolute; inset:5px; border:1px solid rgba(201,162,74,0.35); border-radius:50%; }
    .crest-mark svg { width: 19px; height: 19px; fill: var(--gold-soft); position: relative; z-index: 1; }
    .crest h1 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.7rem; letter-spacing: 2px; color: var(--gold-soft); text-transform: uppercase; }
    .crest .hair { width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 12px auto; }
    .crest p { font-size: 0.64rem; color: #a89876; letter-spacing: 2px; text-transform: uppercase; }

    .card { position: relative; z-index: 1; }

    .tabs { display: flex; gap: 24px; margin-bottom: 26px; border-bottom: 1px solid var(--field-line); }
    .tab-btn { padding: 0 0 11px; border: none; background: transparent; color: #8a8069; font-family:'Inter',sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--gold-soft); }
    .tab-btn.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: var(--gold); }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.6rem; font-weight: 600; color: #a89876; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.5px; }
    .input-wrap { position: relative; }
    input { width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.35); border: 1px solid var(--field-line); border-radius: 4px; color: #f0e8d4; font-family: 'Inter', sans-serif; font-size: 0.86rem; outline: none; transition: border-color 0.25s; }
    input:focus { border-color: var(--gold); }
    input::placeholder { color: #6b624c; }

    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--gold-soft), var(--gold) 55%, var(--gold-deep)); color: #1c1608; border: none; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 0.7rem; font-weight: 800; letter-spacing: 2.2px; text-transform: uppercase; cursor: pointer; margin-top: 10px; box-shadow: 0 8px 20px rgba(201,162,74,0.3); transition: opacity 0.2s, transform 0.15s; }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }

    .msg { font-size: 0.74rem; padding: 9px 12px; border-radius: 4px; margin-bottom: 14px; display: none; letter-spacing: 0.3px; }
    .msg.error { background: rgba(224,138,128,0.12); color: var(--error); border: 1px solid rgba(224,138,128,0.3); display: block; }
    .msg.success { background: rgba(201,162,74,0.12); color: var(--gold-soft); border: 1px solid rgba(201,162,74,0.35); display: block; }

    .divider { text-align: center; color: #8a8069; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; margin: 22px 0 4px; position: relative; }
    .divider::before, .divider::after { content:''; position:absolute; top:50%; width:26%; height:1px; background: var(--field-line); }
    .divider::before { left:0; } .divider::after { right:0; }

    .status-dot { display: inline-block; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; margin-right: 7px; box-shadow: 0 0 6px rgba(201,162,74,0.7); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .coords { position: fixed; bottom: 16px; right: 20px; font-size: 0.62rem; color: rgba(255,255,255,0.3); font-family: 'Inter', sans-serif; letter-spacing: 1px; z-index: 1; }
  </style>
</head>
<body>

<div class="outer-frame">
  <div class="inner-frame">
    <div class="container">

      <div class="crest">
        <div class="crest-mark">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
        </div>
        <h1>Waqar GIS</h1>
        <div class="hair"></div>
        <p><span class="status-dot"></span>Spatial Intelligence · Peshawar</p>
      </div>

      <div class="card">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('login')">Login</button>
          <button class="tab-btn" onclick="switchTab('register')">Register</button>
        </div>

        <div id="loginForm">
          <div id="loginMsg" class="msg"></div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="••••••••" />
          </div>
          <button class="btn" onclick="doLogin()">Enter Portal →</button>
        </div>

        <div id="registerForm" style="display:none;">
          <div id="regMsg" class="msg"></div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Your name" />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPass" placeholder="Min 6 characters" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="regPass2" placeholder="Repeat password" />
          </div>
          <button class="btn" onclick="doRegister()">Create Account</button>
        </div>

        <div class="divider">Secured Access</div>
      </div>

    </div>
  </div>
</div>

<div class="coords">34.0151° N, 71.5249° E · KP, Pakistan</div>

<script>
  function getUsers() { return JSON.parse(localStorage.getItem('waqar_gis_users') || '[]'); }
  function saveUsers(u) { localStorage.setItem('waqar_gis_users', JSON.stringify(u)); }
  (function initAdmin() {
    const users = getUsers();
    if (!users.find(u => u.email === 'admin@waqargis.com')) {
      users.push({ name: 'Waqar (Admin)', email: 'admin@waqargis.com', password: 'waqar!!admin125714TaKhT@BhAi', role: 'admin' });
      saveUsers(users);
    }
  })();
  function switchTab(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  }
  function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + type; }
  function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!email || !pass) { showMsg('loginMsg', 'Please fill all fields.', 'error'); return; }
    const user = getUsers().find(u => u.email === email && u.password === pass);
    if (!user) { showMsg('loginMsg', 'Invalid email or password.', 'error'); return; }
    showMsg('loginMsg', '✓ Login successful! Opening portal...', 'success');
    sessionStorage.setItem('waqar_gis_session', JSON.stringify({ name: user.name, email: user.email, role: user.role || 'user' }));
    setTimeout(() => { window.location.href = 'portal.html'; }, 900);
  }
  function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;
    if (!name||!email||!pass||!pass2) { showMsg('regMsg','Please fill all fields.','error'); return; }
    if (pass.length < 6) { showMsg('regMsg','Password must be at least 6 characters.','error'); return; }
    if (pass !== pass2) { showMsg('regMsg','Passwords do not match.','error'); return; }
    const users = getUsers();
    if (users.find(u => u.email === email)) { showMsg('regMsg','This email is already registered.','error'); return; }
    users.push({ name, email, password: pass, role: 'user' });
    saveUsers(users);
    showMsg('regMsg','✓ Account created! You can now login.','success');
    setTimeout(() => switchTab('login'), 1200);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      document.getElementById('loginForm').style.display !== 'none' ? doLogin() : doRegister();
    }
  });
</script>
</body>
</html>
