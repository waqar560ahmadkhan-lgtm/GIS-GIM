<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waqar GIS Portal</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Draw Plugin -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- Turf.js for Topology & Mensuration -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #1a1a24; color: #ffffff; }

        header {
            background: #0d0e15;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a2c3d;
        }
        header h1 { font-size: 20px; color: #00d2ff; letter-spacing: 1px; }

        .container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 320px;
            background: #14151e;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #2a2c3d;
            overflow-y: auto;
        }

        .tool-group {
            background: #1e202d;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2d3045;
        }

        .tool-group h3 { font-size: 13px; text-transform: uppercase; color: #8892b0; margin-bottom: 10px; }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #2a2d42;
            color: #fff;
            border: 1px solid #3d4263;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            text-align: left;
        }

        button:hover { background: #00d2ff; color: #000; font-weight: bold; }

        #map { flex: 1; height: 100%; z-index: 1; }

        .output-box {
            background: #0d0e15;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            color: #a8b2d1;
            min-height: 80px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<header>
    <h1>Waqar GIS Portal</h1>
    <div style="color: #00d2ff; font-weight: bold;">Status: Active Engine</div>
</header>

<div class="container">
    <div class="sidebar">
        <div class="tool-group">
            <h3>1. Basemap Layer</h3>
            <button onclick="setBasemap('osm')">Street Map (OSM)</button>
            <button onclick="setBasemap('satellite')">Satellite Imagery</button>
        </div>

        <div class="tool-group">
            <h3>2. Topology Check</h3>
            <button onclick="validateTopology()">Validate Topology</button>
        </div>

        <div class="tool-group">
            <h3>3. Mensuration Panel</h3>
            <div id="output" class="output-box">Draw any Point, Line, or Polygon using the toolbar on the map to calculate measurements.</div>
        </div>

        <div class="tool-group">
            <h3>4. Export Data</h3>
            <button onclick="exportGeoJSON()" style="background: #28a745; text-align: center; font-weight: bold;">Download GeoJSON</button>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    // 1. Initialize Map
    var map = L.map('map').setView([34.0151, 71.5249], 12); // Default centered on Peshawar

    // 2. Basemaps
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri'
    });

    function setBasemap(type) {
        if (type === 'osm') {
            map.removeLayer(satellite);
            map.addLayer(osm);
        } else if (type === 'satellite') {
            map.removeLayer(osm);
            map.addLayer(satellite);
        }
    }

    // 3. FeatureGroup to store drawn items
    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // 4. Initialize Leaflet Draw
    var drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: {
            polyline: true,
            polygon: true,
            circle: false,
            rectangle: true,
            marker: true,
            circlemarker: false
        }
    });
    map.addControl(drawControl);

    // 5. Handle Created Layers & Calculations (Turf.js)
    map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        drawnItems.addLayer(layer);
        
        var geojson = layer.toGeoJSON();
        var outputDiv = document.getElementById('output');

        if (e.layerType === 'marker') {
            var coords = geojson.geometry.coordinates;
            outputDiv.innerHTML = `<b>Marker Added:</b><br>Lng: ${coords[0].toFixed(5)}<br>Lat: ${coords[1].toFixed(5)}`;
        } 
        else if (e.layerType === 'polyline') {
            var length = turf.length(geojson, {units: 'kilometers'});
            outputDiv.innerHTML = `<b>Line Distance:</b><br>${length.toFixed(3)} km (${(length * 1000).toFixed(1)} meters)`;
        } 
        else if (e.layerType === 'polygon' || e.layerType === 'rectangle') {
            var area = turf.area(geojson);
            var areaKm = (area / 1000000).toFixed(3);
            outputDiv.innerHTML = `<b>Polygon Area:</b><br>${area.toFixed(2)} m²<br>(${areaKm} sq km)`;
        }
    });

    // 6. Topology Validation (Simple Overlap Check)
    function validateTopology() {
        var layers = drawnItems.getLayers();
        if (layers.length < 2) {
            alert("Topology Check requires at least 2 drawn shapes on the map.");
            return;
        }

        var polygons = [];
        layers.forEach(layer => {
            var gj = layer.toGeoJSON();
            if (gj.geometry.type === 'Polygon') polygons.push(gj);
        });

        if (polygons.length < 2) {
            alert("Draw at least two overlapping polygons to check topology!");
            return;
        }

        var overlap = turf.intersect(polygons[0], polygons[1]);
        if (overlap) {
            alert("Topology Warning: Overlap/Intersection detected between polygons!");
        } else {
            alert("Topology Valid: No polygon overlap detected.");
        }
    }

    // 7. Export GeoJSON Data
    function exportGeoJSON() {
        var data = drawnItems.toGeoJSON();
        if (data.features.length === 0) {
            alert("No drawn features to export!");
            return;
        }
        var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
        var downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "spatial_data.geojson");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }
</script>

</body>
</html>
