<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waqar GIS Portal – Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sand:#d8c9a8;
      --ink:#3a2f22;
      --ink-soft:#6b5c47;
      --gold:#b99656;
      --gold-soft:#cbae76;
      --silver:#8a8a86;
      --silver-dark:#4a4a47;
      --panel:#eee4cf;
      --field-line:#c9b78e;
      --error:#9a3b34;
    }
    body {
      font-family: 'Inter', sans-serif; color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
      background:
        linear-gradient(rgba(216,201,168,0.55), rgba(216,201,168,0.72)),
        url('map-bg.jpg') center/cover no-repeat;
    }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(circle at 50% 35%, rgba(255,250,235,0.25), transparent 60%); pointer-events:none; }

    .outer-frame {
      position: relative; z-index: 1; width: 100%; max-width: 480px; margin: 24px;
      border: 2px solid var(--silver); padding: 6px; box-shadow: 0 30px 70px rgba(40,35,25,0.35);
    }
    .outer-frame::before {
      content: ''; position: absolute; inset: -8px; border: 1px solid var(--silver-dark); opacity: 0.5; pointer-events: none;
    }

    .container { position: relative; z-index: 1; width: 100%; padding: 8px; border: 1px solid var(--gold-soft); }

    .crest { text-align: center; margin: 26px 0 30px; }
    .crest-mark { width: 52px; height: 52px; margin: 0 auto 16px; border: 1.5px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; background: rgba(255,255,255,0.15); }
    .crest-mark::before { content:''; position:absolute; inset:5px; border:1px solid var(--silver); border-radius:50%; }
    .crest-mark svg { width: 20px; height: 20px; fill: var(--gold); position: relative; z-index: 1; }
    .crest h1 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.9rem; letter-spacing: 1.8px; color: var(--ink); text-transform: uppercase; }
    .crest .hair { width: 38px; height: 1.5px; background: var(--gold); margin: 14px auto; }
    .crest p { font-size: 0.68rem; color: var(--ink-soft); letter-spacing: 2.2px; text-transform: uppercase; }

    .card { background: var(--panel); border: 1px solid var(--field-line); padding: 36px 34px 30px; margin: 0 14px 20px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4); }

    .tabs { display: flex; gap: 26px; margin-bottom: 32px; border-bottom: 1px solid var(--field-line); }
    .tab-btn { padding: 0 0 12px; border: none; background: transparent; color: var(--ink-soft); font-family:'Inter',sans-serif; font-size: 0.7rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--ink); }
    .tab-btn.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: var(--gold); }

    .form-group { margin-bottom: 22px; }
    label { display: block; font-size: 0.64rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 9px; text-transform: uppercase; letter-spacing: 1.6px; }
    input { width: 100%; padding: 10px 0; background: transparent; border: none; border-bottom: 1px solid var(--field-line); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.25s; }
    input:focus { border-bottom-color: var(--gold); }
    input::placeholder { color: #a89877; }

    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg,var(--gold-soft),var(--gold)); color: #2c2416; border: none; font-family: 'Inter', sans-serif; font-size: 0.72rem; font-weight: 800; letter-spacing: 2.4px; text-transform: uppercase; cursor: pointer; margin-top: 10px; box-shadow: 0 10px 22px rgba(185,150,86,0.35); transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }

    .msg { font-size: 0.78rem; padding: 10px 14px; border-radius: 2px; margin-bottom: 16px; display: none; letter-spacing: 0.3px; }
    .msg.error { background: rgba(154,59,52,0.1); color: var(--error); border: 1px solid rgba(154,59,52,0.3); display: block; }
    .msg.success { background: rgba(185,150,86,0.15); color: var(--ink); border: 1px solid rgba(185,150,86,0.4); display: block; }

    .divider { text-align: center; color: var(--ink-soft); font-size: 0.64rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 24px; }

    .status-dot { display: inline-block; width: 6px; height: 6px; background: var(--gold); border-radius: 50%; margin-right: 8px; box-shadow: 0 0 6px rgba(185,150,86,0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .coords { position: fixed; bottom: 16px; right: 20px; font-size: 0.64rem; color: rgba(58,47,34,0.45); font-family: 'Inter', sans-serif; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="outer-frame">
  <div class="container">
    <div class="crest">
      <div class="crest-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>
      <h1>Waqar GIS</h1>
      <div class="hair"></div>
      <p><span class="status-dot"></span>Spatial Intelligence · Peshawar</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <div id="loginForm">
        <div id="loginMsg" class="msg"></div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="••••••••" />
        </div>
        <button class="btn" onclick="doLogin()">Enter Portal</button>
      </div>

      <div id="registerForm" style="display:none;">
        <div id="regMsg" class="msg"></div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Your name" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Min 6 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regPass2" placeholder="Repeat password" />
        </div>
        <button class="btn" onclick="doRegister()">Create Account</button>
      </div>

      <div class="divider">Secured Access</div>
    </div>
  </div>
</div>

<div class="coords">34.0151° N, 71.5249° E · KP, Pakistan</div>

<script>
  function getUsers() { return JSON.parse(localStorage.getItem('waqar_gis_users') || '[]'); }
  function saveUsers(u) { localStorage.setItem('waqar_gis_users', JSON.stringify(u)); }
  (function initAdmin() {
    const users = getUsers();
    if (!users.find(u => u.email === 'admin@waqargis.com')) {
      users.push({ name: 'Waqar (Admin)', email: 'admin@waqargis.com', password: 'waqar!!admin125714TaKhT@BhAi', role: 'admin' });
      saveUsers(users);
    }
  })();
  function switchTab(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  }
  function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + type; }
  function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!email || !pass) { showMsg('loginMsg', 'Please fill all fields.', 'error'); return; }
    const user = getUsers().find(u => u.email === email && u.password === pass);
    if (!user) { showMsg('loginMsg', 'Invalid email or password.', 'error'); return; }
    showMsg('loginMsg', '✓ Login successful! Opening portal...', 'success');
    sessionStorage.setItem('waqar_gis_session', JSON.stringify({ name: user.name, email: user.email, role: user.role || 'user' }));
    setTimeout(() => { window.location.href = 'portal.html'; }, 900);
  }
  function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;
    if (!name||!email||!pass||!pass2) { showMsg('regMsg','Please fill all fields.','error'); return; }
    if (pass.length < 6) { showMsg('regMsg','Password must be at least 6 characters.','error'); return; }
    if (pass !== pass2) { showMsg('regMsg','Passwords do not match.','error'); return; }
    const users = getUsers();
    if (users.find(u => u.email === email)) { showMsg('regMsg','This email is already registered.','error'); return; }
    users.push({ name, email, password: pass, role: 'user' });
    saveUsers(users);
    showMsg('regMsg','✓ Account created! You can now login.','success');
    setTimeout(() => switchTab('login'), 1200);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      document.getElementById('loginForm').style.display !== 'none' ? doLogin() : doRegister();
    }
  });
</script>
</body>
</html>
