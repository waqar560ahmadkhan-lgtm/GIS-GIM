<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waqar GIS Portal – Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1120; --panel: #111827; --border: #1f2d45;
      --accent: #2ecc8f; --accent2: #1a9e6b; --text: #e8f0fe;
      --muted: #8899b0; --input-bg: #0d1929; --error: #ff6b6b; --radius: 12px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(46,204,143,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(46,204,143,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
    body::after { content: ''; position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(46,204,143,0.08) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    .container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }
    .logo-area { text-align: center; margin-bottom: 32px; }
    .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; box-shadow: 0 0 30px rgba(46,204,143,0.3); }
    .logo-icon svg { width: 30px; height: 30px; fill: #fff; }
    .logo-area h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
    .logo-area h1 span { color: var(--accent); }
    .logo-area p { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
    .tabs { display: flex; background: var(--input-bg); border-radius: 8px; padding: 4px; margin-bottom: 28px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 9px; border: none; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.2s; background: transparent; color: var(--muted); }
    .tab-btn.active { background: var(--accent); color: #0b1120; font-weight: 600; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 11px 14px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.9rem; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,204,143,0.12); }
    input::placeholder { color: #3a4a60; }
    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0b1120; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, transform 0.15s; margin-top: 8px; letter-spacing: 0.3px; }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .msg { font-size: 0.82rem; padding: 10px 14px; border-radius: 7px; margin-bottom: 16px; display: none; }
    .msg.error { background: rgba(255,107,107,0.12); color: var(--error); border: 1px solid rgba(255,107,107,0.25); display: block; }
    .msg.success { background: rgba(46,204,143,0.1); color: var(--accent); border: 1px solid rgba(46,204,143,0.25); display: block; }
    .divider { text-align: center; color: var(--muted); font-size: 0.75rem; margin: 20px 0; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 38%; height: 1px; background: var(--border); }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .footer-note { text-align: center; margin-top: 24px; font-size: 0.78rem; color: var(--muted); }
    .footer-note span { color: var(--accent); }
    .status-dot { display: inline-block; width: 7px; height: 7px; background: var(--accent); border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .coords { position: fixed; bottom: 16px; right: 20px; font-size: 0.7rem; color: #1f2d45; font-family: monospace; letter-spacing: 0.5px; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <h1>Waqar <span>GIS</span> Portal</h1>
    <p><span class="status-dot"></span>Spatial Intelligence Platform — Peshawar</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>
    <div id="loginForm">
      <div id="loginMsg" class="msg"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="doLogin()">Open Portal →</button>
    </div>
    <div id="registerForm" style="display:none;">
      <div id="regMsg" class="msg"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="Min 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="regPass2" placeholder="Repeat password" />
      </div>
      <button class="btn" onclick="doRegister()">Create Account</button>
    </div>
    <div class="divider">secured firebase access</div>
    <div class="footer-note">
      <span>Cloud Authentication</span> Enabled &nbsp;·&nbsp; Secure & Scalable
    </div>
  </div>
</div>
<div class="coords">34.0151° N, 71.5249° E · KP, Pakistan</div>

<!-- Firebase App SDK & Auth SDK (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // TODO: Apne Firebase Project ki config yahan paste karein (Jo Firebase Console se mili hai)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Expose functions globally for HTML buttons
  window.switchTab = function(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  };

  window.showMsg = function(id, text, type) { 
    const el = document.getElementById(id); 
    el.textContent = text; 
    el.className = 'msg ' + type; 
  };

  window.doLogin = async function() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!email || !pass) { showMsg('loginMsg', 'Please fill all fields.', 'error'); return; }
    
    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, pass);
      showMsg('loginMsg', '✓ Login successful! Opening portal...', 'success');
      setTimeout(() => { window.location.href = 'portal.html'; }, 900);
    } catch (error) {
      showMsg('loginMsg', 'Error: ' + error.message, 'error');
    }
  };

  window.doRegister = async function() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;

    if (!name || !email || !pass || !pass2) { showMsg('regMsg','Please fill all fields.','error'); return; }
    if (pass.length < 6) { showMsg('regMsg','Password must be at least 6 characters.','error'); return; }
    if (pass !== pass2) { showMsg('regMsg','Passwords do not match.','error'); return; }

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
      // Update user profile name
      await updateProfile(userCredential.user, { displayName: name });
      
      showMsg('regMsg','✓ Account created! You can now login.','success');
      setTimeout(() => window.switchTab('login'), 1200);
    } catch (error) {
      showMsg('regMsg', 'Error: ' + error.message, 'error');
    }
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      document.getElementById('loginForm').style.display !== 'none' ? window.doLogin() : window.doRegister();
    }
  });
</script>
</body>
</html>
