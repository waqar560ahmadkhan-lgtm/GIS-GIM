<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waqar GIS Portal – Spatial Intelligence Platform</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #0b1120; color: #e8f0fe; }

    /* =========================================
       LUXURY INTRO DOORS OVERLAY (MANUAL CLICK ONLY)
       ========================================= */
    #intro-overlay {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #030303; z-index: 99999;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
        transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
    }
    #intro-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

    .portal-doors { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; z-index: 5; pointer-events: none; }
    .door {
        width: 50%; height: 100%;
        background: linear-gradient(135deg, #121212 0%, #080808 100%);
        border-top: 6px solid #d4af37; border-bottom: 6px solid #d4af37;
        position: relative; transition: transform 2s cubic-bezier(0.77, 0, 0.175, 1);
        box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
    }
    .door.left-door { border-right: 3px solid #d4af37; transform-origin: left; }
    .door.right-door { border-left: 3px solid #d4af37; transform-origin: right; }

    #intro-overlay.open-doors .left-door { transform: translateX(-100%); }
    #intro-overlay.open-doors .right-door { transform: translateX(100%); }

    .door::before {
        content: ''; position: absolute; top: 50px; bottom: 50px; left: 40px; right: 40px;
        border: 2px solid rgba(212, 175, 55, 0.35); box-shadow: inset 0 0 20px rgba(212,175,55,0.1);
    }
    .door::after {
        content: ''; position: absolute; top: 50%; width: 16px; height: 160px;
        background: linear-gradient(to bottom, #bf953f, #fbf5b7, #b38728, #fbf5b7, #aa771c);
        transform: translateY(-50%); box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); border-radius: 4px;
    }
    .left-door::after { right: 40px; }
    .right-door::after { left: 40px; }

    .door-crest {
        position: absolute; top: 40%; width: 80px; height: 80px;
        border: 2px solid #d4af37; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 20px rgba(212,175,55,0.3); background: rgba(0,0,0,0.6);
    }
    .left-door .door-crest { right: 60px; transform: translateY(-50%); }
    .right-door .door-crest { left: 60px; transform: translateY(-50%); }
    .door-crest span { color: #d4af37; font-size: 24px; }

    .splash-content {
        position: relative; z-index: 4; text-align: center; color: #fff; padding: 20px; max-width: 800px;
        opacity: 0; transform: scale(0.92);
        transition: opacity 1.2s ease 0.4s, transform 1.2s ease 0.4s;
    }
    #intro-overlay.show-splash .splash-content { opacity: 1; transform: scale(1); }

    /* Golden Globe & Mountain Graphics matching your image */
    .globe-glow {
        width: 90px; height: 90px; margin: 0 auto 15px auto;
        background: radial-gradient(circle, rgba(212,175,55,0.4) 0%, transparent 70%);
        display: flex; align-items: center; justify-content: center;
        animation: pulseGlow 3s infinite ease-in-out;
    }
    .globe-glow svg { width: 70px; height: 70px; fill: url(#goldGradient); filter: drop-shadow(0 0 10px #d4af37); }
    
    .mountain-art { font-size: 2rem; color: #d4af37; opacity: 0.85; margin-bottom: 5px; letter-spacing: 2px; }
    
    .splash-title {
        font-family: 'Cinzel', serif; font-size: 3.2rem; font-weight: 800; letter-spacing: 6px;
        background: linear-gradient(180deg, #ffffff 20%, #fbf5b7 50%, #d4af37 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-transform: uppercase; margin-bottom: 8px; filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
    }
    .splash-subtitle { font-family: 'Cinzel', serif; font-size: 0.95rem; letter-spacing: 7px; color: #d4af37; margin-bottom: 30px; text-transform: uppercase; font-weight: 600; }
    
    .enter-btn {
        background: linear-gradient(135deg, #bf953f 0%, #aa771c 100%); color: #050505;
        border: 1px solid #fbf5b7; padding: 15px 45px; font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 700;
        letter-spacing: 4px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease;
        box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4); border-radius: 3px;
    }
    .enter-btn:hover { background: linear-gradient(135deg, #fbf5b7 0%, #bf953f 100%); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.8); transform: translateY(-2px); }
    
    .splash-footer { font-size: 0.75rem; color: #888; letter-spacing: 2px; margin-top: 15px; text-transform: uppercase; }

    @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
    }

    /* =========================================
       WEB GIS PORTAL MAIN INTERFACE LAYOUT
       ========================================= */
    #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

    .top-navbar {
      height: 60px; background: #111827; border-bottom: 1px solid #1f2d45;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100;
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-brand svg { width: 28px; height: 28px; fill: #2ecc8f; }
    .nav-brand h2 { font-size: 1rem; font-weight: 700; letter-spacing: 0.5px; }
    .nav-brand span { font-size: 0.7rem; color: #8899b0; display: block; font-weight: 400; }

    .search-box {
      display: flex; align-items: center; background: #0d1929; border: 1px solid #1f2d45;
      border-radius: 6px; padding: 6px 12px; width: 260px; gap: 8px;
    }
    .search-box input { background: transparent; border: none; color: #fff; outline: none; font-size: 0.85rem; width: 100%; }

    .toolbar-tools { display: flex; align-items: center; gap: 6px; }
    .tool-btn {
      background: transparent; border: 1px solid transparent; color: #8899b0; padding: 6px 10px;
      border-radius: 6px; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: 0.2s;
    }
    .tool-btn:hover, .tool-btn.active { background: #1a2639; color: #2ecc8f; border-color: #1f2d45; }
    .tool-btn svg { width: 16px; height: 16px; fill: currentColor; }

    .main-body { display: flex; flex: 1; position: relative; height: calc(100vh - 60px); }

    .sidebar {
      width: 320px; background: #111827; border-right: 1px solid #1f2d45;
      display: flex; flex-direction: column; z-index: 10; padding: 15px;
    }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #1f2d45; padding-bottom: 10px; }
    .sidebar-header h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #8899b0; }
    
    .layer-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #0d1929; border: 1px solid #1f2d45; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }
    .layer-item label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .layer-item input[type="checkbox"] { accent-color: #2ecc8f; width: 16px; height: 16px; cursor: pointer; }
    
    .opacity-container { margin-top: auto; padding-top: 15px; border-top: 1px solid #1f2d45; }
    .opacity-container label { font-size: 0.75rem; color: #8899b0; display: block; margin-bottom: 5px; }
    .opacity-container input[type="range"] { width: 100%; accent-color: #2ecc8f; }

    .add-layer-btn {
      background: linear-gradient(135deg, #2ecc8f, #1a9e6b); color: #0b1120; border: none;
      padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px; width: 100%;
    }

    #map { flex: 1; height: 100%; position: relative; }

    .map-footer {
      position: absolute; bottom: 0; left: 0; right: 0; height: 28px; background: rgba(11, 17, 32, 0.85);
      border-top: 1px solid #1f2d45; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 0.7rem; color: #8899b0; z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- SVG Gradients Definitions for Globe -->
  <svg width="0" height="0">
    <defs>
      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#bf953f" />
        <stop offset="50%" stop-color="#fbf5b7" />
        <stop offset="100%" stop-color="#aa771c" />
      </linearGradient>
    </defs>
  </svg>

  <!-- LUXURY DOORS OVERLAY (NO TIMER - OPENS ONLY ON CLICK) -->
  <div id="intro-overlay">
      <div class="portal-doors">
          <div class="door left-door"><div class="door-crest"><span>✦</span></div></div>
          <div class="door right-door"><div class="door-crest"><span>✦</span></div></div>
      </div>
      <div class="splash-content">
          <div class="globe-glow">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 m-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2 v1.93 M17.9 17.39c-.26-.81-1-1.39-1.9-1.39h-1v-2c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          </div>
          <div class="mountain-art">▲ ▲ ▲ ▲ ▲</div>
          <h1 class="splash-title">Waqar GIS Portal</h1>
          <p class="splash-subtitle">Explore &nbsp;•&nbsp; Analyze &nbsp;•&nbsp; Decide</p>
          <button class="enter-btn" id="enterPortalBtn">Enter Portal</button>
          <div class="splash-footer">Discover. Visualize. Empower.</div>
      </div>
  </div>

  <!-- MAIN GIS PORTAL INTERFACE -->
  <div id="app-container">
    <div class="top-navbar">
      <div class="nav-brand">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <div>
          <h2>WAQAR GIS PORTAL</h2>
          <span>Web GIS Platform</span>
        </div>
      </div>
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8899b0" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" placeholder="Search location..." />
      </div>
      <div class="toolbar-tools">
        <button class="tool-btn active"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>Select</button>
        <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>Pan</button>
        <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8z"/></svg>Measure</button>
        <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>Buffer</button>
        <button class="tool-btn"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>Print</button>
      </div>
    </div>

    <div class="main-body">
      <div class="sidebar">
        <div class="sidebar-header">
          <h3>Layers</h3>
          <span>⋮</span>
        </div>
        <div class="layer-item"><label><input type="checkbox" checked> Administrative Boundaries</label></div>
        <div class="layer-item"><label><input type="checkbox" checked> Roads</label></div>
        <div class="layer-item"><label><input type="checkbox" checked> Rivers</label></div>
        <div class="layer-item"><label><input type="checkbox" checked> Districts</label></div>
        <div class="layer-item"><label><input type="checkbox"> Land Use / Land Cover</label></div>
        <div class="layer-item"><label><input type="checkbox"> DEM (Elevation)</label></div>
        <div class="layer-item"><label><input type="checkbox" checked> Satellite Imagery</label></div>

        <div class="opacity-container">
          <label>Layer Opacity: 100%</label>
          <input type="range" min="0" max="100" value="100">
        </div>
        <button class="add-layer-btn">+ ADD LAYER</button>
      </div>

      <div id="map">
        <div class="map-footer">
          <span>© 2026 Waqar GIS Portal. All Rights Reserved.</span>
          <span>Accurate Data. Better Decisions.</span>
          <span>34.0151° N, 71.5249° E · EPSG:4326</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([34.0151, 71.5249], 11);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors © CARTO',
        maxZoom: 20
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Intro Doors Animation Trigger (No Auto Timer, Only Manual Click)
    const introOverlay = document.getElementById('intro-overlay');
    const enterBtn = document.getElementById('enterPortalBtn');

    window.addEventListener('load', () => {
        setTimeout(() => introOverlay.classList.add('open-doors'), 400);
        setTimeout(() => introOverlay.classList.add('show-splash'), 600);
    });

    enterBtn.addEventListener('click', () => {
        introOverlay.classList.add('fade-out');
        setTimeout(() => {
            introOverlay.remove();
            map.invalidateSize(); // Fix tile rendering
        }, 1000);
    });
  </script>
</body>
</html>
