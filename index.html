<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Waqar GIS Portal – Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink:#e7e8ec; --muted:#8f95a3; --panel:#181b22; --border:#2c3140;
      --accent:#b7a06a; --accent2:#8c7a48; --field:#12141a;
      --error: #e5848a; --radius: 2px;
    }
    body {
      font-family: 'Inter', sans-serif; color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
      background: linear-gradient(rgba(14,16,22,0.88), rgba(14,16,22,0.88)), url('map-bg.jpg') center/cover no-repeat;
    }
    body::after { content:''; position:fixed; width:600px; height:600px; border-radius:50%; background: radial-gradient(circle, rgba(183,160,106,0.07) 0%, transparent 70%); top:50%; left:50%; transform: translate(-50%,-50%); pointer-events:none; }

    .container { position: relative; z-index: 1; width: 100%; max-width: 460px; padding: 26px; }

    .crest { text-align: center; margin-bottom: 40px; }
    .crest-mark { width: 52px; height: 52px; margin: 0 auto 18px; border: 1px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
    .crest-mark::before { content:''; position:absolute; inset:5px; border:1px solid var(--border); border-radius:50%; }
    .crest-mark svg { width: 20px; height: 20px; fill: var(--accent); position: relative; z-index: 1; }
    .crest h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 2rem; letter-spacing: 1.5px; color: var(--ink); text-transform: uppercase; }
    .crest .hair { width: 34px; height: 1px; background: var(--accent); margin: 14px auto; }
    .crest p { font-size: 0.72rem; color: var(--muted); letter-spacing: 2.5px; text-transform: uppercase; }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 44px 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.45); }

    .tabs { display: flex; gap: 28px; margin-bottom: 38px; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 0 0 14px; border: none; background: transparent; color: var(--muted); font-family:'Inter',sans-serif; font-size: 0.72rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--ink); }
    .tab-btn.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px; background: var(--accent); }

    .form-group { margin-bottom: 24px; }
    label { display: block; font-size: 0.68rem; font-weight: 500; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1.8px; }
    input { width: 100%; padding: 12px 0; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 0.92rem; outline: none; transition: border-color 0.25s; }
    input:focus { border-bottom-color: var(--accent); }
    input::placeholder { color: var(--muted); opacity: 0.5; }

    .btn { width: 100%; padding: 15px; background: transparent; color: var(--ink); border: 1px solid var(--accent); border-radius: var(--radius); font-family: 'Inter', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; margin-top: 14px; transition: all 0.25s; }
    .btn:hover { background: var(--accent); color: #12141a; }

    .msg { font-size: 0.78rem; padding: 10px 14px; border-radius: 2px; margin-bottom: 16px; display: none; letter-spacing: 0.3px; }
    .msg.error { background: rgba(229,132,138,0.1); color: var(--error); border: 1px solid rgba(229,132,138,0.25); display: block; }
    .msg.success { background: rgba(183,160,106,0.1); color: var(--accent); border: 1px solid rgba(183,160,106,0.3); display: block; }

    .divider { text-align: center; color: var(--muted); font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; margin: 30px 0 6px; }

    .status-dot { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px rgba(183,160,106,0.6); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .coords { position: fixed; bottom: 18px; right: 22px; font-size: 0.66rem; color: rgba(255,255,255,0.22); font-family: 'Inter', sans-serif; letter-spacing: 1px; }
  </style>
</head>
<body>
<div class="container">
  <div class="crest">
    <div class="crest-mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>
    <h1>Waqar GIS</h1>
    <div class="hair"></div>
    <p><span class="status-dot"></span>Spatial Intelligence · Peshawar</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <div id="loginForm">
      <div id="loginMsg" class="msg"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="doLogin()">Enter Portal</button>
    </div>

    <div id="registerForm" style="display:none;">
      <div id="regMsg" class="msg"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" placeholder="Min 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="regPass2" placeholder="Repeat password" />
      </div>
      <button class="btn" onclick="doRegister()">Create Account</button>
    </div>

    <div class="divider">Secured Access</div>
  </div>
</div>

<div class="coords">34.0151° N, 71.5249° E · KP, Pakistan</div>

<script>
  function getUsers() { return JSON.parse(localStorage.getItem('waqar_gis_users') || '[]'); }
  function saveUsers(u) { localStorage.setItem('waqar_gis_users', JSON.stringify(u)); }
  (function initAdmin() {
    const users = getUsers();
    if (!users.find(u => u.email === 'admin@waqargis.com')) {
      users.push({ name: 'Waqar (Admin)', email: 'admin@waqargis.com', password: 'waqar!!admin125714TaKhT@BhAi', role: 'admin' });
      saveUsers(users);
    }
  })();
  function switchTab(tab) {
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  }
  function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + type; }
  function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    if (!email || !pass) { showMsg('loginMsg', 'Please fill all fields.', 'error'); return; }
    const user = getUsers().find(u => u.email === email && u.password === pass);
    if (!user) { showMsg('loginMsg', 'Invalid email or password.', 'error'); return; }
    showMsg('loginMsg', '✓ Login successful! Opening portal...', 'success');
    sessionStorage.setItem('waqar_gis_session', JSON.stringify({ name: user.name, email: user.email, role: user.role || 'user' }));
    setTimeout(() => { window.location.href = 'portal.html'; }, 900);
  }
  function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPass').value;
    const pass2 = document.getElementById('regPass2').value;
    if (!name||!email||!pass||!pass2) { showMsg('regMsg','Please fill all fields.','error'); return; }
    if (pass.length < 6) { showMsg('regMsg','Password must be at least 6 characters.','error'); return; }
    if (pass !== pass2) { showMsg('regMsg','Passwords do not match.','error'); return; }
    const users = getUsers();
    if (users.find(u => u.email === email)) { showMsg('regMsg','This email is already registered.','error'); return; }
    users.push({ name, email, password: pass, role: 'user' });
    saveUsers(users);
    showMsg('regMsg','✓ Account created! You can now login.','success');
    setTimeout(() => switchTab('login'), 1200);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      document.getElementById('loginForm').style.display !== 'none' ? doLogin() : doRegister();
    }
  });
</script>
</body>
</html>
