<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waqar GIS Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b132b;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(28, 37, 65, 0.9) 0%, rgba(11, 19, 43, 1) 100%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .login-card {
      background: rgba(18, 27, 54, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .portal-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .portal-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 14px;
      color: #d4af37;
    }

    .portal-header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .portal-header p {
      font-size: 12px;
      color: #a2a8d3;
      margin-top: 6px;
    }

    .tab-group {
      display: flex;
      background: rgba(11, 19, 43, 0.7);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #8d99ae;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: #d4af37;
      color: #0b132b;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #a2a8d3;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 6px;
      color: #1a1a1a;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: #d4af37;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      border: none;
      border-radius: 6px;
      color: #0b132b;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .btn-login:hover {
      background: #c5a028;
    }

    .footer-text {
      text-align: center;
      font-size: 11px;
      color: #6c757d;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="portal-header">
      <div class="portal-icon">
        <!-- Clean Islamic Geometric Star / Astrolabe Icon -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </div>
      <h1>Waqar GIS Portal</h1>
      <p>Geospatial & Spatial Intelligence Suite</p>
    </div>

    <div class="tab-group">
      <div class="tab active">Login</div>
      <div class="tab">Register</div>
    </div>

    <form>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Open Portal</button>
    </form>

    <div class="footer-text">
      Secure Access • Local Data
    </div>
  </div>

</body>
</html>
