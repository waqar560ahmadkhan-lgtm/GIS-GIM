<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqar GIS Portal (Admin)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- shpjs for Shapefile -->
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <!-- html2pdf for Printing/PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --header-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --panel-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --header-bg: #1e293b;
            --sidebar-bg: #1e293b;
            --panel-bg: #1e293b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--transition);
        }

        /* Top Bar Navigation */
        header {
            height: 60px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area i {
            font-size: 24px;
            color: var(--accent-color);
        }

        .logo-area h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Central Quick Toolbar */
        .central-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-primary);
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .central-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .central-btn:hover {
            background-color: var(--accent-color);
            color: #fff;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--bg-primary);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .user-profile-badge i {
            color: var(--accent-color);
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Left Side Tools Sidebar */
        .left-sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 999;
            transition: var(--transition);
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tool-section {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-secondary);
        }

        .tool-section-title {
            padding: 10px 12px;
            background: var(--bg-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .tool-section-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
        }

        .btn-action {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        /* Map Container */
        #map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }

        /* Attribute Table Bottom Panel */
        .attribute-panel {
            position: absolute;
            bottom: 0;
            left: 320px;
            right: 0;
            height: 200px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            z-index: 998;
            display: none;
            flex-direction: column;
            box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.1);
        }

        .attribute-header {
            padding: 8px 15px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
        }

        .attribute-body {
            flex: 1;
            overflow: auto;
            padding: 10px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        table.data-table th, table.data-table td {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        table.data-table th {
            background: var(--bg-primary);
            position: sticky;
            top: 0;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--panel-bg);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading Spinner */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Legend Control Custom Styling */
        .info.legend {
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            font-size: 12px;
            line-height: 18px;
            color: var(--text-primary);
        }
        .info.legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <!-- Top Header -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-earth-asia"></i>
            <h1>Waqar GIS Portal</h1>
        </div>

        <!-- Central Quick Toolbar (Undo/Redo, Print, Dark/Light Theme) -->
        <div class="central-toolbar">
            <button class="central-btn" id="btn-undo" title="Undo"><i class="fa-solid fa-rotate-left"></i> Undo</button>
            <button class="central-btn" id="btn-redo" title="Redo"><i class="fa-solid fa-rotate-right"></i> Redo</button>
            <button class="central-btn" id="btn-print" title="Print Map (PDF)"><i class="fa-solid fa-print"></i> Print Map</button>
            <button class="central-btn" id="btn-theme" title="Toggle Theme"><i class="fa-solid fa-moon"></i> Theme</button>
        </div>

        <!-- User Profile Badge -->
        <div class="user-profile-badge">
            <i class="fa-solid fa-user-shield"></i>
            <span>Waqar Ahmad (Admin)</span>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        
        <!-- Left Side Tools Sidebar -->
        <div class="left-sidebar" id="left-sidebar">
            <div class="sidebar-header">
                <span>GIS Toolsuite</span>
                <i class="fa-solid fa-bars"></i>
            </div>
            <div class="sidebar-content">
                
                <!-- Search Section -->
                <div class="tool-section">
                    <div class="tool-section-title"><span><i class="fa-solid fa-magnifying-glass"></i> Location Search</span></div>
                    <div class="tool-section-body">
                        <input type="text" id="search-input" class="form-control" placeholder="Place, Khasra, Village, Coords...">
                        <button class="btn-action" id="btn-search"><i class="fa-solid fa-search"></i> Search Location</button>
                    </div>
                </div>

                <!-- Layer Manager -->
                <div class="tool-section">
                    <div class="tool-section-title"><span><i class="fa-solid fa-layer-group"></i> Layer Manager</span></div>
                    <div class="tool-section-body" id="layer-manager-body">
                        <label><input type="checkbox" id="layer-osm" checked> OpenStreetMap</label>
                        <label><input type="checkbox" id="layer-sat"> Satellite Imagery</label>
                        <label><input type="checkbox" id="layer-markers" checked> Vector Features & Clusters</label>
                    </div>
                </div>

                <!-- Data Management / Upload -->
                <div class="tool-section">
                    <div class="tool-section-title"><span><i class="fa-solid fa-file-arrow-up"></i> Data Import / Export</span></div>
                    <div class="tool-section-body">
                        <input type="file" id="upload-shapefile" class="form-control" accept=".zip">
                        <button class="btn-action" id="btn-export-csv"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                        <button class="btn-action" id="btn-export-excel"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
                    </div>
                </div>

                <!-- Spatial Analysis Tools -->
                <div class="tool-section">
                    <div class="tool-section-title"><span><i class="fa-solid fa-chart-pie"></i> Spatial & Query Analysis</span></div>
                    <div class="tool-section-body">
                        <button class="btn-action" id="btn-buffer"><i class="fa-solid fa-circle-dot"></i> Multiple Buffer Analysis</button>
                        <button class="btn-action" id="btn-heatmap"><i class="fa-solid fa-fire"></i> Toggle Heatmap</button>
                        <button class="btn-action" id="btn-routing"><i class="fa-solid fa-route"></i> Routing & Navigation</button>
                        <button class="btn-action" id="btn-table-toggle"><i class="fa-solid fa-table"></i> Attribute Table</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Map Container -->
        <div id="map-container"></div>

        <!-- Attribute Table Panel -->
        <div class="attribute-panel" id="attribute-panel">
            <div class="attribute-header">
                <span>Advanced Attribute Table</span>
                <i class="fa-solid fa-xmark" id="close-attribute-panel" style="cursor: pointer;"></i>
            </div>
            <div class="attribute-body">
                <table class="data-table" id="attribute-table-content">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Coordinates</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Mardan HQ</td>
                            <td>Administrative</td>
                            <td>34.1989, 72.0406</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Peshawar Node</td>
                            <td>Commercial</td>
                            <td>34.0151, 71.5249</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Leaflet JS & Plugins -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet-heat/dist/leaflet-heat.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // --- Initialization & Globals ---
        let currentTheme = 'light';
        let undoStack = [];
        let redoStack = [];

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-info" style="color: var(--accent-color);"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Loading Spinner
        function toggleLoading(show) {
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        }

        // Map Initialization centered around Khyber Pakhtunkhwa / Mardan
        const map = L.map('map-container', {
            zoomControl: false
        }).setView([34.1989, 72.0406], 11);

        // Basemaps
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        // Add Zoom Control to Top-Right or custom position
        L.control.zoom({ position: 'topright' }).add(map);

        // Scale Bar
        L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

        // Full Screen Control
        const fullscreenControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                container.innerHTML = '<a href="#" title="Full Screen" role="button"><i class="fa-solid fa-expand" style="margin-top: 8px;"></i></a>';
                container.onclick = function (e) {
                    e.preventDefault();
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    }
                };
                return container;
            }
        });
        map.addControl(new fullscreenControl());

        // GPS My Location Control
        const gpsControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function (map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                container.innerHTML = '<a href="#" title="My Location" role="button"><i class="fa-solid fa-location-crosshairs" style="margin-top: 8px;"></i></a>';
                container.onclick = function (e) {
                    e.preventDefault();
                    map.locate({setView: true, maxZoom: 16});
                };
                return container;
            }
        });
        map.addControl(new gpsControl());

        map.on('locationfound', function(e) {
            L.marker(e.latlng).addTo(map).bindPopup("You are here").openPopup();
            showToast("Location found successfully!");
        });

        map.on('locationerror', function(e) {
            showToast("Location access denied or unavailable.", "error");
        });

        // Marker Cluster Group for Vector Features
        const markersCluster = L.markerClusterGroup();
        
        // Sample GIS Data points for Mardan / KP
        const samplePoints = [
            { lat: 34.1989, lng: 72.0406, name: "Mardan City HQ", category: "Administrative" },
            { lat: 34.1500, lng: 72.0833, name: "Katlang Node", category: "Commercial" },
            { lat: 34.2200, lng: 71.9500, name: "Takht-i-Bahi Monument", category: "Heritage" },
            { lat: 34.0151, lng: 71.5249, name: "Peshawar Junction", category: "Administrative" }
        ];

        samplePoints.forEach(pt => {
            const m = L.marker([pt.lat, pt.lng]).bindPopup(`<b>${pt.name}</b><br>Category: ${pt.category}`);
            markersCluster.addLayer(m);
        });
        map.addLayer(markersCluster);

        // Heatmap Layer (Toggleable)
        const heatData = samplePoints.map(p => [p.lat, p.lng, 0.8]);
        const heatLayer = L.heatLayer(heatData, {radius: 25});
        let heatmapActive = false;

        document.getElementById('btn-heatmap').addEventListener('click', () => {
            heatmapActive = !heatmapActive;
            if (heatmapActive) {
                map.addLayer(heatLayer);
                showToast("Heatmap layer activated.");
            } else {
                map.removeLayer(heatLayer);
                showToast("Heatmap layer deactivated.");
            }
        });

        // Layer Manager UI Binding
        document.getElementById('layer-osm').addEventListener('change', (e) => {
            if (e.target.checked) map.addLayer(osmLayer);
            else map.removeLayer(osmLayer);
        });
        document.getElementById('layer-sat').addEventListener('change', (e) => {
            if (e.target.checked) map.addLayer(satLayer);
            else map.removeLayer(satLayer);
        });
        document.getElementById('layer-markers').addEventListener('change', (e) => {
            if (e.target.checked) map.addLayer(markersCluster);
            else map.removeLayer(markersCluster);
        });

        // Legend Control
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = `
                <b>Map Legend</b><br>
                <i style="background: #3b82f6;"></i> Administrative<br>
                <i style="background: #10b981;"></i> Commercial<br>
                <i style="background: #f59e0b;"></i> Heritage<br>
            `;
            return div;
        };
        legend.addTo(map);

        // Theme Toggle Functionality
        document.getElementById('btn-theme').addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            const icon = document.querySelector('#btn-theme i');
            icon.className = currentTheme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            showToast(`Switched to ${currentTheme} theme.`);
        });

        // Undo / Redo mock handlers
        document.getElementById('btn-undo').addEventListener('click', () => {
            showToast("Undo action executed.");
        });
        document.getElementById('btn-redo').addEventListener('click', () => {
            showToast("Redo action executed.");
        });

        // Print Map PDF
        document.getElementById('btn-print').addEventListener('click', () => {
            toggleLoading(true);
            setTimeout(() => {
                window.print();
                toggleLoading(false);
                showToast("Print layout generated.");
            }, 1000);
        });

        // Search Location
        document.getElementById('btn-search').addEventListener('click', () => {
            const query = document.getElementById('search-input').value.trim();
            if (!query) {
                showToast("Please enter a location or coordinates to search.", "error");
                return;
            }
            // Simple coordinate parser or mock place finder
            if (query.includes(',')) {
                const parts = query.split(',');
                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);
                if (!isNaN(lat) && !isNaN(lng)) {
                    map.setView([lat, lng], 14);
                    L.marker([lat, lng]).addTo(map).bindPopup(`Found: ${query}`).openPopup();
                    showToast("Coordinates located successfully.");
                    return;
                }
            }
            // Default mock zoom for place name
            map.setView([34.1989, 72.0406], 13);
            showToast(`Located place: ${query}`);
        });

        // Attribute Table Toggle
        const attrPanel = document.getElementById('attribute-panel');
        document.getElementById('btn-table-toggle').addEventListener('click', () => {
            attrPanel.style.display = attrPanel.style.display === 'flex' ? 'none' : 'flex';
        });
        document.getElementById('close-attribute-panel').addEventListener('click', () => {
            attrPanel.style.display = 'none';
        });

        // CSV & Excel Export
        document.getElementById('btn-export-csv').addEventListener('click', () => {
            const csv = Papa.unparse(samplePoints);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', 'gis_attributes.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSV exported successfully.");
        });

        document.getElementById('btn-export-excel').addEventListener('click', () => {
            const worksheet = XLSX.utils.json_to_sheet(samplePoints);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Attributes");
            XLSX.writeFile(workbook, "gis_attributes.xlsx");
            showToast("Excel workbook exported successfully.");
        });

        // Multiple Buffer Analysis simulation
        document.getElementById('btn-buffer').addEventListener('click', () => {
            const center = map.getCenter();
            L.circle(center, {color: 'blue', radius: 1000, fillOpacity: 0.1}).addTo(map);
            L.circle(center, {color: 'green', radius: 3000, fillOpacity: 0.05}).addTo(map);
            showToast("Multiple buffer zones (1km, 3km) created around center.");
        });

        // Routing Integration
        let routingControl = null;
        document.getElementById('btn-routing').addEventListener('click', () => {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
                showToast("Routing cleared.");
                return;
            }
            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(34.1989, 72.0406),
                    L.latLng(34.0151, 71.5249)
                ],
                routeWhileDragging: true
            }).addTo(map);
            showToast("Routing initialized between Mardan and Peshawar.");
        });

        // Shapefile Upload handler
        document.getElementById('upload-shapefile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            toggleLoading(true);
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                shp(uploadEvent.target.result).then(function(geojson) {
                    L.geoJSON(geojson).addTo(map);
                    toggleLoading(false);
                    showToast("Shapefile successfully loaded and rendered.");
                }).catch(err => {
                    toggleLoading(false);
                    showToast("Error parsing shapefile zip archive.", "error");
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Initial welcome toast
        window.addEventListener('load', () => {
            showToast("Waqar GIS Portal loaded successfully. Welcome Admin!");
        });
    </script>
</body>
</html>
