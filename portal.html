<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waqar GIS Portal v2.0</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- Leaflet Draw CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial;
}

body{
    height:100vh;
    overflow:hidden;
}

/* LOADING SCREEN */
#loading{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0b3d62;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
    font-size:22px;
}

/* HEADER */
.header{
    height:60px;
    background:#0b3d62;
    color:white;
    display:flex;
    align-items:center;
    padding:0 20px;
    justify-content:space-between;
}

.header h2{
    font-size:22px;
}

.theme-btn{
    background:white;
    color:#0b3d62;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
    font-weight: bold;
}

/* LAYOUT */
.container{
    display:flex;
    height:calc(100vh - 60px);
    position: relative;
}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:#ffffff;
    border-right:1px solid #ccc;
    padding:15px;
    overflow:auto;
}

.sidebar h3{
    margin-bottom:15px;
    color:#0b3d62;
}

.tool{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:none;
    background:#0b3d62;
    color:white;
    cursor:pointer;
    border-radius:5px;
    text-align: left;
}

.tool:hover{
    background:#145b8d;
}

/* MAP */
#map{
    flex:1;
}

/* INFO BOX */
#infoBox{
    position:absolute;
    bottom:20px;
    left:320px;
    background:white;
    padding:10px 15px;
    border-radius:8px;
    box-shadow:0 0 8px gray;
    z-index:9999;
    font-size:14px;
    pointer-events: none;
}

/* USER PANEL */
#userPanel{
    position:absolute;
    top:70px;
    right:20px;
    z-index:9999;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 10px #999;
    display:none;
}

#userPanel h3{
    margin-bottom:10px;
    color:#0b3d62;
}

/* DARK MODE */
.dark{
    background:#1e1e1e;
}

.dark .sidebar{
    background:#222;
    color:white;
}

.dark .sidebar h3{
    color:#4db8ff;
}

.dark .tool{
    background:#333;
}

.dark #infoBox{
    background:#222;
    color:white;
}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
    <h1>🌍 Waqar GIS Portal</h1>
    <p>Loading Web GIS Application...</p>
</div>

<!-- HEADER -->
<div class="header">
    <h2>🌍 Waqar GIS Portal v2.0</h2>
    <button class="theme-btn" onclick="themeChange()">
        Dark / Light
    </button>
</div>

<!-- CONTAINER -->
<div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>GIS Tools</h3>
        
        <button class="tool" onclick="searchCoordinate()">📍 Coordinate Search</button>
        <button class="tool" onclick="addBookmark()">⭐ Add Bookmark</button>
        <button class="tool" onclick="exportGeoJSON()">⬇ Export GeoJSON</button>
        <button class="tool" onclick="document.getElementById('geoFile').click()">📂 Import GeoJSON</button>
        <button class="tool" onclick="createBuffer()">⭕ Buffer Analysis</button>
        <button class="tool" onclick="fullScreen()">⛶ Full Screen</button>
        <button class="tool" onclick="exportCSV()">📊 Export CSV</button>
        <button class="tool" onclick="showAttributeTable()">📋 Attribute Table</button>

        <hr style="margin: 15px 0;">

        <h3>Layers</h3>
        <div id="layers" style="font-size: 13px; color: #555;">
            Base Maps (Use top-right control to switch)
        </div>
    </div>

    <!-- MAP -->
    <div id="map"></div>

    <!-- INFO BOX -->
    <div id="infoBox">
        🌍 Waqar GIS Portal v2.0<br>
        📌 Web Based GIS Application<br>
        🛰️ Leaflet + Remote Sensing Ready
    </div>
</div>

<!-- USER LOGIN PANEL -->
<div id="userPanel">
    <h3>User Login</h3>
    <input id="username" placeholder="Username" style="width:200px;padding:5px"><br><br>
    <button onclick="loginUser()" style="padding:5px 10px; background:#0b3d62; color:white; border:none; border-radius:4px; cursor:pointer;">Login</button>
</div>

<!-- FILE UPLOAD HIDDEN -->
<input type="file" id="geoFile" accept=".geojson,.json" style="display:none" onchange="importGeoJSON(event)">

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Leaflet Draw JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
// MAP INITIALIZATION
var map = L.map('map').setView([34.1989, 72.0406], 10);

// BASEMAPS
var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: 'OpenStreetMap'
});

var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Satellite'
});

var terrain = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: 'OpenTopoMap'
});

osm.addTo(map);

var baseMaps = {
    "OpenStreetMap": osm,
    "Satellite": satellite,
    "Terrain": terrain
};

L.control.layers(baseMaps).addTo(map);
L.control.scale().addTo(map);

// DRAW & MEASUREMENT TOOLS
var drawnItems = new L.FeatureGroup();
map.addLayer(drawnItems);

var drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems }
});
map.addControl(drawControl);

function calculateDistance(latlngs) {
    var total = 0;
    for (var i = 0; i < latlngs.length - 1; i++) {
        total += latlngs[i].distanceTo(latlngs[i + 1]);
    }
    return (total / 1000).toFixed(3) + " km";
}

map.on("draw:created", function(e) {
    var layer = e.layer;
    drawnItems.addLayer(layer);

    if (e.layerType === "polyline") {
        var points = layer.getLatLngs();
        layer.bindPopup("Distance: " + calculateDistance(points)).openPopup();
    } else if (e.layerType === "polygon") {
        var area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
        layer.bindPopup("Area: " + (area / 1000000).toFixed(3) + " km²").openPopup();
    }
});

// GEOJSON STORAGE & IMPORT/EXPORT
var geojsonLayers = [];

function loadGeoJSON(data) {
    var layer = L.geoJSON(data, {
        onEachFeature: function(feature, layer) {
            if (feature.properties) {
                layer.bindPopup(JSON.stringify(feature.properties));
            }
        }
    });
    layer.addTo(map);
    geojsonLayers.push(layer);
    map.fitBounds(layer.getBounds());
}

function importGeoJSON(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var data = JSON.parse(e.target.result);
        loadGeoJSON(data);
    };
    reader.readAsText(file);
}

function exportGeoJSON() {
    var data = drawnItems.toGeoJSON();
    var file = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(file);
    var link = document.createElement("a");
    link.href = url;
    link.download = "Waqar_GIS_Data.geojson";
    link.click();
}

// SEARCH & TOOLS
function searchCoordinate() {
    var lat = prompt("Enter Latitude");
    var lon = prompt("Enter Longitude");
    if (lat && lon) {
        map.setView([parseFloat(lat), parseFloat(lon)], 15);
        L.marker([lat, lon]).addTo(map).bindPopup("Selected Location").openPopup();
    }
}

var bookmarks = [];
function addBookmark() {
    var center = map.getCenter();
    var name = prompt("Bookmark Name");
    if (name) {
        bookmarks.push({ name: name, lat: center.lat, lng: center.lng, zoom: map.getZoom() });
        alert("Bookmark Saved");
    }
}

function createBuffer() {
    var radius = prompt("Enter Buffer Radius (meters)");
    if (!radius) return;
    var center = map.getCenter();
    L.circle(center, {
        radius: parseInt(radius),
        color: "red",
        fillOpacity: 0.2
    }).addTo(map).bindPopup("Buffer Zone: " + radius + " meters").openPopup();
}

function fullScreen() {
    var mapDiv = document.getElementById("map");
    if (!document.fullscreenElement) {
        mapDiv.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

function exportCSV() {
    var csv = "Latitude,Longitude\n";
    map.eachLayer(function(layer) {
        if (layer instanceof L.Marker) {
            csv += layer.getLatLng().lat + "," + layer.getLatLng().lng + "\n";
        }
    });
    var blob = new Blob([csv], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "GIS_Data.csv";
    a.click();
}

function showAttributeTable() {
    if (geojsonLayers.length === 0) {
        alert("No Data Available");
        return;
    }
    var table = "";
    geojsonLayers.forEach(function(layer) {
        layer.eachLayer(function(f) {
            table += JSON.stringify(f.feature.properties) + "\n\n";
        });
    });
    alert(table);
}

// USER SYSTEM
function loginUser() {
    var name = document.getElementById("username").value;
    if (name) {
        localStorage.setItem("GIS_User", name);
        alert("Welcome " + name);
        document.getElementById("userPanel").style.display = "none";
    }
}

function openLogin() {
    document.getElementById("userPanel").style.display = "block";
}

// THEME TOGGLE
function themeChange() {
    document.body.classList.toggle("dark");
}

// MAP EVENTS
map.on('click', function(e) {
    L.popup()
        .setLatLng(e.latlng)
        .setContent("Latitude: " + e.latlng.lat.toFixed(6) + "<br>Longitude: " + e.latlng.lng.toFixed(6))
        .openOn(map);
});

map.on("mousemove", function(e) {
    document.getElementById("infoBox").innerHTML = 
        "🌍 Waqar GIS Portal v2.0<br>" +
        "Lat: " + e.latlng.lat.toFixed(5) + "<br>" +
        "Lng: " + e.latlng.lng.toFixed(5);
});

// LOADING SCREEN TIMEOUT
window.onload = function() {
    setTimeout(function() {
        document.getElementById("loading").style.display = "none";
        map.invalidateSize();
    }, 1500);
};

// ERROR HANDLING
window.onerror = function(message, source, line) {
    console.log("GIS Error:", message, "Line:", line);
};
</script>

</body>
</html>
