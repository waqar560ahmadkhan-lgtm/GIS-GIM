<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waqar GIS Portal — Executive Spatial Suite</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <!-- Tailwind & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- html2canvas & jsPDF for Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    #map { height: calc(100vh - 64px); width: 100%; z-index: 10; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(197, 160, 89, 0.5); border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #c5a059; }
  </style>
</head>
<body class="overflow-hidden">

  <!-- Top Navigation Bar -->
  <header class="h-16 glass-panel border-b border-slate-800 flex items-center justify-between px-4 z-30 relative">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-lg bg-amber-600/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-lg">
        <i class="fa-solid fa-earth-asia"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-wider text-slate-100">WAQAR GIS PORTAL</h1>
        <p class="text-[10px] text-amber-400 font-mono tracking-widest uppercase">Executive Spatial Suite</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button onclick="openPrintLayout()" class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded border border-slate-700 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-print text-amber-400"></i><span>Export Map</span>
      </button>
      <button onclick="toggleSidebar()" class="px-3 py-1.5 text-xs font-medium bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 rounded border border-amber-500/40 transition flex items-center space-x-1.5">
        <i class="fa-solid fa-layer-group"></i><span>Layers & Data</span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex relative h-[calc(100vh-64px)] w-full overflow-hidden">
    
    <!-- Map Container -->
    <div id="map" class="flex-1"></div>

    <!-- Collapsible Sidebar -->
    <aside id="sidebar" class="w-80 glass-panel border-l border-slate-800 flex flex-col z-20 transition-all duration-300">
      <div class="p-3 border-b border-slate-800 flex items-center justify-between">
        <span class="text-xs font-bold tracking-wider text-amber-400 uppercase"><i class="fa-solid fa-database mr-1.5"></i> Spatial Database</span>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-4 flex-1 overflow-y-auto custom-scrollbar space-y-4">
        <div>
          <label class="text-[11px] text-slate-400 block mb-1 font-medium">Active Basemap</label>
          <select id="basemap-select" onchange="changeBasemap(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
            <option value="googleSat">Google Satellite Hybrid</option>
            <option value="osm">OpenStreetMap Standard</option>
            <option value="dark">CartoDB Dark Matter</option>
            <option value="topo">Esri Topographic</option>
          </select>
        </div>
        
        <div>
          <label class="text-[11px] text-slate-400 block mb-1 font-medium">Mouza Boundary Vector</label>
          <div id="mouza-container-list" class="space-y-1 text-xs text-slate-300 max-h-48 overflow-y-auto custom-scrollbar p-1 bg-slate-900/50 rounded border border-slate-800">
            <span class="text-slate-500 italic text-[11px]">Loading Mouza features...</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Export Layout Modal -->
  <div id="print-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-xl p-6 border border-slate-700 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-amber-400 uppercase tracking-wider"><i class="fa-solid fa-file-pdf mr-2"></i>Map Export Configuration</h3>
        <button onclick="closePrintLayout()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-300 block mb-1">Map Title / Project Name</label>
          <input type="text" id="export-title" value="Waqar GIS Spatial Analysis Report" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-slate-300 block mb-1">Orientation</label>
            <select id="export-orientation" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-slate-200">
              <option value="landscape">Landscape</option>
              <option value="portrait">Portrait</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-300 block mb-1">Include Elements</label>
            <div class="space-y-1 pt-1">
              <label class="flex items-center text-xs text-slate-300"><input type="checkbox" id="chk-legend" checked class="mr-2 rounded bg-slate-900 border-slate-700 text-amber-600 focus:ring-0"> Legend</label>
              <label class="flex items-center text-xs text-slate-300"><input type="checkbox" id="chk-scale" checked class="mr-2 rounded bg-slate-900 border-slate-700 text-amber-600 focus:ring-0"> Scale Bar</label>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-800">
        <button onclick="closePrintLayout()" class="px-4 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">Cancel</button>
        <button onclick="executePDFExport()" class="px-4 py-2 text-xs font-medium bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded shadow transition flex items-center space-x-1.5">
          <i class="fa-solid fa-download"></i><span>Generate PDF</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 glass-panel px-4 py-2.5 rounded-lg border border-amber-500/30 text-xs text-amber-300 z-50 transform translate-y-20 opacity-0 transition-all duration-300 shadow-xl flex items-center space-x-2">
    <i class="fa-solid fa-circle-check text-amber-400"></i><span id="toast-msg">Action completed successfully</span>
  </div>

  <!-- Loading Overlay for Export -->
  <div id="export-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center space-y-3">
    <div class="w-12 h-12 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
    <p class="text-xs font-mono text-amber-400 tracking-wider uppercase" id="export-status-text">Rendering High-Resolution Canvas...</p>
  </div>

  <!-- Leaflet & Draw JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <script>
    // ===== INITIALIZE MAP & BASEMAPS =====
    const map = L.map('map', { zoomControl: false }).setView([34.0151, 71.5249], 14);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const basemaps = {
      googleSat: L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'], attribution: '&copy; Google Maps' }),
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
      dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; CARTO' }),
      topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '&copy; Esri' })
    };

    let currentBasemap = basemaps.googleSat.addTo(map);

    function changeBasemap(key) {
      if (basemaps[key]) {
        map.removeLayer(currentBasemap);
        currentBasemap = basemaps[key].addTo(map);
        showToast(`Basemap switched to ${key}`);
      }
    }

    // ===== UI UTILITIES =====
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('hidden');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      t.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => { t.classList.add('translate-y-20', 'opacity-0'); }, 3000);
    }

    // ===== FEATURE LAYERS & CONTAINERS =====
    let mouzaGeoLayer = null;
    let mouzaItemsData = [];
    let mouzaCount = 0;

    function populateMouzaSidebarList() {
      const c = document.getElementById('mouza-container-list');
      if (!c) return;
      c.innerHTML = '';
      if (mouzaItemsData.length === 0) {
        c.innerHTML = '<span class="text-slate-500 italic text-[11px]">No vector items loaded</span>';
        return;
      }
      mouzaItemsData.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-1.5 hover:bg-slate-800 rounded cursor-pointer transition';
        div.innerHTML = `<span class="truncate text-slate-300"><i class="fa-solid fa-vector-polygon text-amber-400 mr-1.5 text-[10px]"></i>${item.name}</span><i class="fa-solid fa-search-plus text-slate-500 hover:text-amber-400 text-[10px]"></i>`;
        div.onclick = () => {
          map.fitBounds(item.layer.getBounds(), { padding: [50, 50] });
          item.layer.openPopup();
        };
        c.appendChild(div);
      });
    }

    // ===== PRINT / PDF EXPORT ENGINE =====
    function openPrintLayout() { document.getElementById('print-modal').classList.remove('hidden'); }
    function closePrintLayout() { document.getElementById('print-modal').classList.add('hidden'); }

    function setExportProgress(p) {
      const el = document.getElementById('export-status-text');
      if (el) el.innerText = `Rendering PDF Package... ${p}%`;
    }

    function hideExportOverlay() {
      document.getElementById('export-overlay').classList.add('hidden');
    }

    function executePDFExport() {
      const title = document.getElementById('export-title').value || 'Waqar GIS Report';
      const orientation = document.getElementById('export-orientation').value;
      const inclLegend = document.getElementById('chk-legend').checked;
      const inclScale = document.getElementById('chk-scale').checked;

      closePrintLayout();
      document.getElementById('export-overlay').classList.remove('hidden');
      setExportProgress(20);

      // CORS FIX: Temporarily swap Google tiles with Esri World Imagery during canvas export
      const activeKey = Object.keys(basemaps).find(k => basemaps[k] === currentBasemap);
      const needsSwitch = (activeKey === 'googleSat');
      
      if (needsSwitch) {
        map.removeLayer(currentBasemap);
        currentBasemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
      }

      setTimeout(() => {
        setExportProgress(50);
        html2canvas(document.getElementById('map'), { useCORS: true, allowTaint: true, logging: false }).then(canvas => {
          setExportProgress(80);
          const imgData = canvas.toDataURL('image/jpeg', 0.9);
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: orientation, unit: 'mm', format: 'a4' });
          
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();

          // Header
          pdf.setFillColor(15, 23, 42);
          pdf.rect(0, 0, pageWidth, 20, 'F');
          pdf.setFontSize(12); pdf.setTextColor(212, 175, 55);
          pdf.text(title.toUpperCase(), 14, 12);
          pdf.setFontSize(8); pdf.setTextColor(148, 163, 184);
          pdf.text('Waqar GIS Portal — Executive Spatial Suite', pageWidth - 14, 12, { align: 'right' });

          // Map Image Frame
          pdf.setDrawColor(197, 160, 89);
          pdf.setLineWidth(0.5);
          pdf.rect(12, 23, pageWidth - 24, 155, 'S');
          pdf.addImage(imgData, 'JPEG', 13, 24, pageWidth - 26, 153);

          // Scale bar representation
          if (inclScale) {
            pdf.setFillColor(21, 24, 30);
            pdf.setDrawColor(197, 160, 89);
            pdf.roundedRect(16, 162, 35, 12, 1, 1, 'FD');
            pdf.setFontSize(7); pdf.setTextColor(226, 232, 240);
            pdf.text('Scale: 1 : 5,000', 19, 168);
            pdf.setDrawColor(212, 175, 55); pdf.setLineWidth(1);
            pdf.line(19, 171, 40, 171);
            pdf.circle(19, 171, 0.5, 'S');
            pdf.circle(40, 171, 0.5, 'S');
          }

          // Legend
          if (inclLegend) {
            pdf.setFillColor(21, 24, 30); pdf.setDrawColor(197, 160, 89);
            pdf.roundedRect(pageWidth - 57, 150, 42, 24, 2, 2, 'FD');
            pdf.setFontSize(8); pdf.setTextColor(212, 175, 55);
            pdf.text('Legend', pageWidth - 53, 157);
            pdf.setFontSize(7); pdf.setTextColor(226, 232, 240);
            pdf.text('— Mouza Boundary', pageWidth - 53, 164);
            pdf.text('— Spatial Feature', pageWidth - 53, 170);
          }

          // Footer
          pdf.setFontSize(8); pdf.setTextColor(120, 130, 148);
          pdf.text('Waqar GIS Portal — Professional Spatial Intelligence', 14, pageHeight - 8);
          pdf.text('Page 1 of 1', pageWidth - 14, pageHeight - 8, { align: 'right' });

          setExportProgress(100);
          pdf.save('Waqar_GIS_Report.pdf');

          if (needsSwitch) {
            map.removeLayer(currentBasemap);
            currentBasemap = basemaps.googleSat.addTo(map);
          }
          hideExportOverlay();
          showToast('✓ PDF exported successfully!');
        }).catch(err => {
          console.error(err);
          if (needsSwitch) {
            map.removeLayer(currentBasemap);
            currentBasemap = basemaps.googleSat.addTo(map);
          }
          hideExportOverlay();
          alert('PDF Export failed.');
        });
      }, 1500);
    }

    // ===== LOAD MOUZA GEOJSON =====
    fetch('Jammat_Polygon.json')
      .then(r => {
        if (!r.ok) throw new Error('Jammat_Polygon.json not found');
        return r.json();
      })
      .then(data => {
        mouzaGeoLayer = L.geoJSON(data, {
          style: { color: '#ffcc00', weight: 1.5, fillColor: '#c5a059', fillOpacity: 0.15 },
          onEachFeature: (feature, layer) => {
            const props = feature.properties || {};
            const name = props.Name || props.NAME || props.mouza || props.MOUZA || `Mouza #${++mouzaCount}`;
            mouzaItemsData.push({ name, layer });
            
            let html = `<div style="font-size:11px; color:#15181e;"><strong>Mouza:</strong> ${name}<br>`;
            Object.keys(props).forEach(k => { html += `<strong>${k}:</strong> ${props[k]}<br>`; });
            html += `</div>`;
            layer.bindPopup(html);
          }
        }).addTo(map);

        populateMouzaSidebarList();
        showToast('Mouza vector dataset loaded! ✓');
      })
      .catch(err => {
        console.warn('Jammat_Polygon.json auto-load skipped or failed:', err);
        const c = document.getElementById('mouza-container-list');
        if (c) c.innerHTML = '<div style="font-size:10px;color:#f87171;text-align:center;padding:4px;">Jammat_Polygon.json missing (optional)</div>';
      });
  </script>
</body>
</html>
