<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waqar GIS Portal</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Original Styling Layout */
        #sidebar {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: #ffffff; padding: 15px; border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 300px;
        }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #333; }
        button { width: 100%; padding: 8px; margin-bottom: 5px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 4px; font-weight: bold; }
        button:hover { background: #34495e; }
        input[type="file"] { width: 100%; font-size: 12px; }
        
        #hud {
            position: absolute; bottom: 10px; left: 10px; z-index: 1000;
            background: rgba(0, 0, 0, 0.75); color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px;
        }
        #areaResult { font-size: 13px; background: #f8f9fa; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div id="hud">Lat: 33.68440 | Lng: 73.04790 | Zoom: 6</div>

    <div id="sidebar">
        <h3 style="margin-top:0; color:#2c3e50;">Waqar GIS Portal</h3>
        
        <div class="control-group">
            <label>Editing History</label>
            <button onclick="undoAction()">Undo Last Action</button>
            <button onclick="redoAction()">Redo Action</button>
        </div>

        <div class="control-group">
            <label>Import Vector Data (GeoJSON / KML)</label>
            <input type="file" id="fileInput" accept=".geojson,.json,.kml" onchange="handleFileUpload(event)">
        </div>

        <div class="control-group">
            <label>Massavi Area Calculator</label>
            <div id="areaResult">Draw a polygon to measure area.</div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- ToGeoJSON for KML parsing -->
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.0/togeojson.js"></script>

    <script>
        // Google Satellite Tiles (Original Setup Restored)
        const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '© Google Maps'
        });

        const osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const map = L.map('map', {
            center: [33.6844, 73.0479],
            zoom: 6,
            layers: [googleSat]
        });

        // Layer Switcher
        const baseLayers = {
            "Google Satellite": googleSat,
            "OpenStreetMap": osmMap
        };
        L.control.layers(baseLayers).addTo(map);

        // History Stacks for Undo / Redo
        let undoStack = [];
        let redoStack = [];

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const drawControl = new L.Control.Draw({
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            drawnItems.addLayer(layer);
            
            undoStack.push({ type: 'add', layer: layer });
            redoStack = []; 

            calculateMassaviArea(layer);
        });

        function undoAction() {
            if (undoStack.length === 0) {
                alert("No actions to undo!");
                return;
            }
            const action = undoStack.pop();
            if (action.type === 'add') {
                drawnItems.removeLayer(action.layer);
                redoStack.push(action);
            }
        }

        function redoAction() {
            if (redoStack.length === 0) {
                alert("No actions to redo!");
                return;
            }
            const action = redoStack.pop();
            if (action.type === 'add') {
                drawnItems.addLayer(action.layer);
                undoStack.push(action);
            }
        }

        // File Upload Handling (GeoJSON & KML)
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.kml')) {
                reader.onload = function (e) {
                    const dom = new DOMParser().parseFromString(e.target.result, 'text/xml');
                    const converted = toGeoJSON.kml(dom);
                    addGeoJsonToMap(converted);
                };
                reader.readAsText(file);
            } else {
                reader.onload = function (e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        addGeoJsonToMap(json);
                    } catch (err) {
                        alert("Error parsing file format.");
                    }
                };
                reader.readAsText(file);
            }
        }

        function addGeoJsonToMap(geoJsonData) {
            const layer = L.geoJSON(geoJsonData, {
                onEachFeature: function (feature, layer) {
                    drawnItems.addLayer(layer);
                    undoStack.push({ type: 'add', layer: layer });
                }
            });
            map.fitBounds(layer.getBounds());
        }

        // Massavi Area Calculation (Kanal, Marla, SqFt)
        function calculateMassaviArea(layer) {
            if (layer instanceof L.Polygon || layer instanceof L.Rectangle) {
                let latLngs = layer.getLatLngs()[0];
                let sqMeters = L.GeometryUtil ? L.GeometryUtil.geodesicArea(latLngs) : getApproxArea(latLngs);
                
                let sqFeet = sqMeters * 10.7639;
                let marla = sqFeet / 272.25;
                let kanal = marla / 20;

                document.getElementById('areaResult').innerHTML = `
                    <b>Calculated Area:</b><br>
                    - Kanal: <b>${kanal.toFixed(2)}</b><br>
                    - Marla: <b>${marla.toFixed(2)}</b><br>
                    - Sq. Feet: <b>${sqFeet.toFixed(2)}</b>
                `;
            }
        }

        function getApproxArea(latLngs) {
            let total = 0;
            for (let i = 0; i < latLngs.length; i++) {
                let p1 = latLngs[i];
                let p2 = latLngs[(i + 1) % latLngs.length];
                total += (p2.lng - p1.lng) * (p2.lat + p1.lat);
            }
            return Math.abs(total) * 111319 * 111319 * Math.cos(33 * Math.PI / 180) / 2;
        }

        // Live Cursor HUD Coordinates Tracker
        map.on('mousemove', function (e) {
            document.getElementById('hud').innerHTML = 
                `Lat: ${e.latlng.lat.toFixed(5)} | Lng: ${e.latlng.lng.toFixed(5)} | Zoom: ${map.getZoom()}`;
        });
    </script>
</body>
</html>
