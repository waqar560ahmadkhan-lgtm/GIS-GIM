<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waqar GIS Portal - Executive Spatial Suite</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet & Draw CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

  <!-- JS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="auth-guard.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #15181e; display: flex; }

    /* Left Sidebar */
    .sidebar {
      width: 310px; min-width: 310px;
      background: linear-gradient(180deg, #20242c 0%, #15181e 100%);
      color: #f1f5f9; padding: 20px 16px; display: flex; flex-direction: column;
      gap: 14px; overflow-y: auto; border-right: 2px solid #c5a059;
      box-shadow: 6px 0 25px rgba(0, 0, 0, 0.6); z-index: 1000; position: relative;
    }

    .portal-brand {
      display: flex; align-items: center; gap: 12px; padding-bottom: 12px;
      border-bottom: 1px solid rgba(197, 160, 89, 0.3);
    }
    .portal-icon-arch {
      width: 40px; height: 44px;
      background: linear-gradient(135deg, #d4af37 0%, #8a6d2b 100%);
      border-radius: 16px 16px 4px 4px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; color: #15181e; border: 1px solid #f3e5ab;
    }
    .portal-title { font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700; color: #f8fafc; letter-spacing: 1px; }

    .sidebar h3 {
      font-size: 10px; color: #c5a059; letter-spacing: 1.2px; margin-bottom: 6px;
      font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 5px;
    }
    .sidebar h3::before { content: "◈"; font-size: 9px; color: #c5a059; }

    .panel-box {
      background: rgba(38, 43, 53, 0.7); padding: 10px; border-radius: 10px;
      border: 1px solid rgba(197, 160, 89, 0.25); backdrop-filter: blur(6px);
    }

    .panel-box input, .panel-box select {
      width: 100%; padding: 8px 10px; border-radius: 6px;
      border: 1px solid rgba(197, 160, 89, 0.35); background: #15181e;
      color: #f8fafc; font-size: 12px; outline: none; margin-bottom: 6px;
    }

    .coord-inputs { display: flex; gap: 6px; }

    .btn {
      width: 100%; padding: 8px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 11px; font-weight: 700; transition: all 0.2s ease;
    }
    .btn-gold { background: linear-gradient(135deg, #c5a059 0%, #967635 100%); color: #0f1217; border: 1px solid #f3e5ab; }
    .btn-gold:hover { background: linear-gradient(135deg, #d4af37 0%, #a8843c 100%); }
    .btn-dark { background: #252a34; color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-dark:hover { background: #2f3542; border-color: #c5a059; }
    .btn-emerald { background: linear-gradient(135deg, #059669 0%, #046c51 100%); color: #fff; border: 1px solid #34d399; }

    /* Main Container */
    #main-container { flex: 1; display: flex; flex-direction: column; position: relative; height: 100vh; }
    #map { flex: 1; width: 100%; height: 100%; background: #1e232a; }

    /* Attribute Table Panel (Bottom) */
    #attribute-panel {
      height: 180px; background: rgba(21, 24, 30, 0.95);
      border-top: 2px solid #c5a059; padding: 10px 16px; overflow-y: auto;
      backdrop-filter: blur(10px); z-index: 999;
    }
    #attribute-panel h4 { color: #d4af37; font-size: 12px; margin-bottom: 8px; font-family: 'Cinzel', serif; }
    
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; color: #e2e8f0; font-size: 11px; text-align: left; }
    th { background: #2a303c; color: #c5a059; padding: 6px 10px; border: 1px solid rgba(197, 160, 89, 0.2); }
    td { padding: 6px 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
    tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

    /* Result Box Overlay */
    #results {
      position: absolute; top: 20px; right: 20px;
      background: rgba(21, 24, 30, 0.9); color: #f8fafc; padding: 10px 14px;
      border-radius: 8px; font-size: 12px; border: 1px solid rgba(197, 160, 89, 0.4);
      z-index: 999; max-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #results strong { color: #d4af37; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="portal-brand">
      <div class="portal-icon-arch">🏛️</div>
      <div class="portal-title">Waqar GIS Portal</div>
    </div>

    <!-- Location Search -->
    <div class="panel-box">
      <h3>Search Location</h3>
      <input type="text" id="sidebar-search" placeholder="District Or Tehsil..." />
      <button class="btn btn-gold" onclick="searchLocation()">SEARCH</button>
    </div>

    <!-- Go-To Coordinates -->
    <div class="panel-box">
      <h3>Go-To Coordinates</h3>
      <div class="coord-inputs">
        <input type="number" id="coord-lat" step="any" placeholder="Lat (34.01)" />
        <input type="number" id="coord-lng" step="any" placeholder="Lng (71.53)" />
      </div>
      <button class="btn btn-gold" onclick="goToCoordinates()">LOCATE</button>
    </div>

    <!-- Import Spatial File (.geojson / .kml) -->
    <div class="panel-box">
      <h3>Import GeoJSON / KML</h3>
      <input type="file" id="file-input" accept=".geojson, .json, .kml" />
      <button class="btn btn-gold" onclick="loadSpatialFile()">UPLOAD & VIEW</button>
    </div>

    <!-- Basemap Selector -->
    <div class="panel-box">
      <h3>Basemap Selector</h3>
      <select id="basemap-select" onchange="switchBasemap(this.value)">
        <option value="osm">Street Map (OpenStreetMap)</option>
        <option value="satellite">Satellite Imagery (Esri)</option>
        <option value="topo">Esri Topographic</option>
        <option value="dark">Dark Gray Canvas (CartoDB)</option>
      </select>
    </div>

    <!-- Topology Check -->
    <div>
      <h3>Topology Check</h3>
      <button class="btn btn-dark" onclick="checkTopology()">Validate Topology</button>
    </div>

    <!-- Export Panel -->
    <div class="panel-box">
      <h3>Export Options</h3>
      <button class="btn btn-emerald" onclick="exportGeoJSON()" style="margin-bottom:6px;">Download GeoJSON</button>
      <button class="btn btn-dark" onclick="exportMapImage()" style="margin-bottom:6px;">Export PNG Image</button>
      <button class="btn btn-dark" onclick="exportMapPDF()">Export PDF Report</button>
    </div>
  </div>

  <div id="main-container">
    <div id="map"></div>
    <div id="results">Draw or search to inspect attributes...</div>

    <!-- Attribute Table Panel -->
    <div id="attribute-panel">
      <h4>◈ Attribute Table Viewer</h4>
      <div class="table-wrapper">
        <table id="attr-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Area (Marla)</th>
              <th>Length (m / km)</th>
              <th>Coordinates</th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="5" style="text-align:center; color:#788294;">No digitization features added yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const map = L.map('map', { crossOrigin: true }).setView([34.0, 71.5], 8);

  const basemaps = {
    osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }),
    satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' }),
    topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri Topo' }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' })
  };

  let currentBasemap = basemaps.osm;
  currentBasemap.addTo(map);

  let coordMarker = null;
  let uploadedLayerGroup = L.layerGroup().addTo(map);
  let featureCounter = 0;
  let featureRecords = [];

  function switchBasemap(key) {
    if (currentBasemap) map.removeLayer(currentBasemap);
    if (basemaps[key]) {
      currentBasemap = basemaps[key];
      currentBasemap.addTo(map);
    }
  }

  function searchLocation() {
    const query = document.getElementById('sidebar-search').value;
    if (!query) return alert('Enter location name!');
    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=pk`)
      .then(r => r.json())
      .then(d => {
        if (!d.length) return alert('Location not found!');
        map.setView([parseFloat(d[0].lat), parseFloat(d[0].lon)], 12);
        L.marker([parseFloat(d[0].lat), parseFloat(d[0].lon)]).addTo(map).bindPopup(d[0].display_name).openPopup();
      });
  }

  function goToCoordinates() {
    const lat = parseFloat(document.getElementById('coord-lat').value);
    const lng = parseFloat(document.getElementById('coord-lng').value);
    if (isNaN(lat) || isNaN(lng)) return alert('Enter valid coordinates!');
    if (coordMarker) map.removeLayer(coordMarker);
    map.setView([lat, lng], 15);
    coordMarker = L.marker([lat, lng]).addTo(map).bindPopup(`Lat: ${lat}<br>Lng: ${lng}`).openPopup();
  }

  /* Upload GeoJSON or KML File */
  function loadSpatialFile() {
    const file = document.getElementById('file-input').files[0];
    if (!file) return alert('Select a .geojson or .kml file!');

    const fileName = file.name.toLowerCase();
    uploadedLayerGroup.clearLayers();

    if (fileName.endsWith('.kml')) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const runLayer = omnivore.kml.parse(e.target.result);
        runLayer.addTo(uploadedLayerGroup);
        map.fitBounds(runLayer.getBounds());
      };
      reader.readAsText(file);
    } else {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const layer = L.geoJSON(JSON.parse(e.target.result), {
            style: { color: '#d4af37', fillColor: '#c5a059', fillOpacity: 0.4 }
          });
          uploadedLayerGroup.addLayer(layer);
          map.fitBounds(layer.getBounds());
        } catch(err) { alert('Invalid GeoJSON format!'); }
      };
      reader.readAsText(file);
    }
  }

  /* Leaflet Draw & Attribute Table Logic */
  const drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);
  const drawControl = new L.Control.Draw({ edit: { featureGroup: drawnItems } });
  map.addControl(drawControl);

  map.on(L.Draw.Event.CREATED, function(e) {
    const layer = e.layer;
    drawnItems.addLayer(layer);
    featureCounter++;

    const geojson = layer.toGeoJSON();
    const type = e.layerType;
    let area = 'N/A', length = 'N/A', coords = '';

    if (type === 'polygon') {
      const areaM2 = turf.area(geojson);
      area = (areaM2 / 4047).toFixed(2);
      length = (turf.length(geojson, {units: 'kilometers'}) * 1000).toFixed(2) + ' m';
      coords = 'Polygon Bounds';
    } else if (type === 'polyline') {
      length = turf.length(geojson, {units: 'kilometers'}).toFixed(2) + ' km';
      coords = 'Line Path';
    } else if (type === 'marker') {
      const c = geojson.geometry.coordinates;
      coords = `${c[1].toFixed(4)}, ${c[0].toFixed(4)}`;
    }

    featureRecords.push({ id: featureCounter, type: type.toUpperCase(), area, length, coords });
    updateAttributeTable();
  });

  function updateAttributeTable() {
    const tbody = document.querySelector('#attr-table tbody');
    if (featureRecords.length === 0) return;
    
    tbody.innerHTML = featureRecords.map(f => `
      <tr>
        <td>#${f.id}</td>
        <td><strong>${f.type}</strong></td>
        <td>${f.area}</td>
        <td>${f.length}</td>
        <td>${f.coords}</td>
      </tr>
    `).join('');
  }

  function checkTopology() {
    const data = drawnItems.toGeoJSON();
    if (!data.features.length) return alert('Draw a shape first!');
    let errors = 0;
    data.features.forEach(f => {
      if (f.geometry.type === 'Polygon') errors += turf.kinks(f).features.length;
    });
    alert(errors > 0 ? `Found ${errors} self-intersection errors!` : 'Topology Valid!');
  }

  function exportGeoJSON() {
    const data = drawnItems.toGeoJSON();
    if (!data.features.length) return alert('No features drawn!');
    const a = document.createElement('a');
    a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(data));
    a.download = 'gis_data.geojson';
    a.click();
  }

  /* Export Map as PNG Image */
  function exportMapImage() {
    html2canvas(document.getElementById('map-wrapper') || document.getElementById('map')).then(canvas => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'Waqar_GIS_Map.png';
      a.click();
    });
  }

  /* Export Map as PDF Report */
  function exportMapPDF() {
    html2canvas(document.getElementById('map-wrapper') || document.getElementById('map')).then(canvas => {
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('landscape');
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(16);
      pdf.text('Waqar GIS Portal - Spatial Analysis Report', 14, 15);
      pdf.addImage(imgData, 'PNG', 14, 25, 260, 150);
      pdf.save('Waqar_GIS_Report.pdf');
    });
  }
</script>
</body>
</html>
